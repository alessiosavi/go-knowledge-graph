# Source code, pull requests and diffs.
# Thresholds tuned on eval/golden/code.jsonl (GLiNER sidecar); select with labels=code.
entities:
  - { name: repository, threshold: 0.5 }
  - { name: service, threshold: 0.5 }
  - { name: module, threshold: 0.5 }
  - { name: function, threshold: 0.5 }
  - { name: api, threshold: 0.5 }
  - { name: data_store, text: data store, threshold: 0.5 }
  - { name: library, threshold: 0.5 }
  - { name: config_setting, text: config setting, threshold: 0.5 }
  - { name: test, threshold: 0.5 }
  - { name: issue, threshold: 0.5 }
  - { name: person, threshold: 0.5 }
relations:
  - { name: part_of, text: part of, threshold: 0.25 }
  - { name: depends_on, text: depends on, threshold: 0.25 }
  - { name: calls, threshold: 0.25 }
  - { name: implements, threshold: 0.25 }
  - { name: defines, threshold: 0.25 }
  - { name: exposes, threshold: 0.25 }
  - { name: reads_from, text: reads from, threshold: 0.25 }
  - { name: writes_to, text: writes to, threshold: 0.25 }
  - { name: tested_by, text: tested by, threshold: 0.25 }
  - { name: configured_by, text: configured by, threshold: 0.25 }
  - { name: fixes, threshold: 0.25 }
  - { name: authored_by, text: authored by, threshold: 0.25 }
