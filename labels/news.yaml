# News-oriented preset: people, organizations, places, events and products
# with corporate/editorial relations. Serve it with
# {"labels":"news"} or -F labels=news.
entities:
  - { name: person, threshold: 0.4 }
  - { name: organization, threshold: 0.4 }
  - { name: location, threshold: 0.4 }
  - { name: event, threshold: 0.4 }
  - { name: product, threshold: 0.35 }
relations:
  - { name: works_at, threshold: 0.25 }
  - { name: member_of, threshold: 0.25 }
  - { name: located_in, threshold: 0.25 }
  - { name: acquired, threshold: 0.3 }
  - { name: announced, threshold: 0.3 }
