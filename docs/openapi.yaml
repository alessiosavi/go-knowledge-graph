openapi: 3.0.3
info:
  title: gkg — Go Knowledge Graph API
  version: v0.1.0
  description: |
    REST surface of gkg: ingestion, documents, search, entity views, traversal,
    a guarded read-only Cypher endpoint, and the bounded read-only ask agent.
    The relative server URL uses the same origin through the nginx edge or
    directly to gkg. Through the edge, "Try it out" reuses the browser's Basic
    login; do not authorize a bearer there (the edge would reject it). The edge
    replaces the Basic Authorization header with its internal bearer token.
    Direct requests require `Authorization: Bearer <key>` when `GKG_API_KEY`
    is set; health probes, metrics and the static UI/docs shells are exempt.
    Operator routes are not exposed through the edge (404 there).
    `/mcp` is MCP streamable HTTP, not REST, and uses the same authentication;
    see docs/agent-setup.md for client setup.
    Body sizes are capped by configuration (`Ingest.MaxUploadMB` for ingestion,
    128 KiB for product PUT, and 1 MiB for other JSON endpoints, including ask); Cypher row count and timeout
    are capped by `Limits.CypherRows` / `Limits.CypherTimeoutMS`. The search,
    entity, traverse, document, domain and product read routes share
    `Limits.ReadTimeoutMS` (default 15 s); a read that exceeds it is stopped on
    the server and answered `504 query_timeout`. The agent ask routes are bounded
    by `Agent.TimeoutS` instead: `POST /v1/agent/ask` answers `504 agent_timeout`;
    the stream route reports it as an `agent_timeout` SSE error event.
    With GCP auth, the ask routes return JSON `502` with `auth_permanent` or
    `auth_transient` for credential failures before streaming starts. Once SSE
    headers are sent, those kinds appear in SSE error events.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: /
    description: Same origin, through the nginx edge or directly to gkg
security:
  - bearerAuth: []
  - basicAuth: []
tags:
  - name: admin
    description: Loopback domain administration; never exposed through the edge
  - name: documents
    description: Ingest, read and remove document versions
  - name: graph
    description: Search entities and chunks, inspect evidence and traverse facts
  - name: products
    description: Read products, released observations and store watermarks, and push or remove a product
  - name: agent
    description: Bounded read-only question answering and streaming
  - name: health
    description: Process liveness
  - name: operator
    description: Direct gkg access only; not exposed through the edge (404 there)
paths:
  /v1/admin/domains/move:
    post:
      tags: [admin]
      operationId: domainMove
      summary: Move documents to a domain
      description: |
        Requires a loopback socket peer, the internal bearer when configured,
        and schema v4. Before any change, failed or in-flight members cause
        409 not_done listing their IDs. Done members reset extraction atomically
        and enqueue stored chunks; superseded versions get domain properties only.
        Retry with the same op_id to resume committed progress or return the stored
        result of a completed operation. A binding detected during the operation
        leaves it incomplete and resumable after unbind.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [document_ids, domain]
              properties:
                document_ids: {type: array, minItems: 1, items: {type: string}}
                domain: {type: string, pattern: '^[a-z0-9-]{1,40}$'}
                op_id: {type: string}
      responses:
        '202':
          description: Operation accepted; completed means all resets were queued
          content:
            application/json:
              schema:
                type: object
                required: [op_id, state]
                properties:
                  op_id: {type: string}
                  state: {type: string, enum: [running, completed, failed, incomplete]}
                  remaining: {type: array, items: {type: string}, description: Documents still in an incomplete merge source}
                  skipped: {type: array, items: {type: string}, description: Superseded documents skipped by undo}
        '400': {description: Invalid slug or operation}
        '401': {description: Missing or invalid bearer}
        '403': {description: Non-loopback peer}
        '404': {description: Unknown document, domain or operation}
        '409': {description: 'domain_has_products if any source or destination has a product store binding, not_done for blocking documents, or schema_not_v4'}
        '413': {description: JSON body exceeds 1 MiB}
        '500': {description: Store failure; committed documents stay queued}
  /v1/admin/domains/merge:
    post:
      tags: [admin]
      operationId: domainMerge
      summary: Merge a source domain into a target
      description: |
        Requires a loopback socket peer and the internal bearer when configured.
        Requires schema v4. Before any change, failed or in-flight members cause
        409 not_done listing their IDs. Done members reset extraction atomically
        and enqueue stored chunks; superseded versions get domain properties only.
        Retry with the same op_id to resume or return the stored result of a completed
        operation. A merge with concurrent remaining members reports incomplete and
        their IDs; retry includes them. A binding detected during the operation also
        leaves it incomplete and resumable after unbind.
        Undo requires a completed operation and live members done again; superseded
        members are skipped and listed in the result.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, into]
              properties:
                from: {type: string, pattern: '^[a-z0-9-]{1,40}$'}
                into: {type: string, pattern: '^[a-z0-9-]{1,40}$'}
                op_id: {type: string}
      responses:
        '202':
          description: Operation accepted; completed means all resets were queued
          content:
            application/json:
              schema:
                type: object
                required: [op_id, state]
                properties:
                  op_id: {type: string}
                  state: {type: string, enum: [running, completed, failed, incomplete]}
                  remaining: {type: array, items: {type: string}, description: Documents still in an incomplete merge source}
                  skipped: {type: array, items: {type: string}, description: Superseded documents skipped by undo}
        '400': {description: Invalid slug or operation}
        '401': {description: Missing or invalid bearer}
        '403': {description: Non-loopback peer}
        '404': {description: Unknown document, domain or operation}
        '409': {description: 'domain_has_products if either domain has a product store binding, not_done for blocking documents, or schema_not_v4'}
        '413': {description: JSON body exceeds 1 MiB}
        '500': {description: Store failure; committed documents stay queued}
  /v1/admin/domains/rename:
    post:
      tags: [admin]
      operationId: domainRename
      summary: Rename a domain display name
      description: |
        Requires a loopback socket peer, the internal bearer when configured,
        and schema v4. Changes only the domain display name and records a ledger
        decision. Does not reset extraction or requeue documents.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain, name]
              properties:
                domain: {type: string, pattern: '^[a-z0-9-]{1,40}$'}
                name: {type: string, minLength: 1}
      responses:
        '202':
          description: Display name updated and ledger decision recorded
          content:
            application/json:
              schema:
                type: object
                required: [op_id, state]
                properties:
                  op_id: {type: string}
                  state: {type: string, enum: [completed]}
        '400': {description: Invalid slug or operation}
        '401': {description: Missing or invalid bearer}
        '403': {description: Non-loopback peer}
        '404': {description: Unknown document, domain or operation}
        '409': {description: schema_not_v4}
        '413': {description: JSON body exceeds 1 MiB}
        '500': {description: Store failure}
  /v1/admin/domains/undo:
    post:
      tags: [admin]
      operationId: domainUndo
      summary: Undo a domain operation
      description: |
        Requires a loopback socket peer, the internal bearer when configured,
        and schema v4. Requires a completed move, merge or undo operation.
        Before any change, failed or in-flight live members cause 409 not_done
        listing their IDs. Restores live members' previous domains by resetting
        extraction and requeueing. Superseded versions are skipped and listed
        in skipped. Retry with the original op_id to resume the same undo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [op_id]
              properties:
                op_id: {type: string, minLength: 1}
      responses:
        '202':
          description: Operation accepted; completed means all resets were queued
          content:
            application/json:
              schema:
                type: object
                required: [op_id, state]
                properties:
                  op_id: {type: string}
                  state: {type: string, enum: [running, completed, failed, incomplete]}
                  remaining: {type: array, items: {type: string}, description: Documents still in an incomplete merge source}
                  skipped: {type: array, items: {type: string}, description: Superseded documents skipped by undo}
        '400': {description: Invalid slug or operation}
        '401': {description: Missing or invalid bearer}
        '403': {description: Non-loopback peer}
        '404': {description: Unknown document, domain or operation}
        '409': {description: 'domain_has_products if any source or destination has a product store binding, not_done for blocking documents, or schema_not_v4'}
        '413': {description: JSON body exceeds 1 MiB}
        '500': {description: Store failure; committed documents stay queued}
  /v1/admin/rebuild:
    post:
      tags: [operator]
      operationId: rebuildDocuments
      summary: Rebuild completed documents (operator route)
      description: |
        Operator route; not exposed through the edge (404 there). Requires the internal bearer when configured.
        On a shared box, requires the owner's go after ingest finishes and the queue
        is empty. Removes facts, mentions and rejected-fact audits, preserves
        documents and stored chunk text, and re-queues extraction and judging
        without fetching or converting again. Busy documents are skipped.
        Each document reset commits separately; if a later store operation fails,
        earlier successful resets remain queued. Inspect statuses before retrying.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                labels:
                  type: string
                  description: Installed preset; empty or omitted keeps each document's preset.
                  pattern: '^[a-zA-Z0-9_-]*$'
                document_id:
                  type: string
                  description: One document ID; empty or omitted selects every done document.
      responses:
        "202":
          description: Completed documents reset and queued; busy IDs (lock held) skipped. Documents that stop being done during a bulk run are skipped and not listed.
          content:
            application/json:
              schema:
                type: object
                required: [queued, busy]
                properties:
                  queued:
                    type: integer
                    minimum: 0
                  busy:
                    type: array
                    items:
                      type: string
        "400":
          description: Invalid JSON or unknown/invalid preset; nothing reset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown document ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Selected document is not done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: JSON body exceeds 1 MiB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Store failure; earlier successful resets remain queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: No rebuild pipeline wired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/ingest:
    post:
      tags: [documents]
      operationId: ingestDocument
      summary: Submit a document for ingestion
      description: |
        Accepts JSON (`url` or `text`), or a multipart form with a `file`
        field. The submission is queued for the worker pool. If the client
        disconnects while the queue is full, the server queues it in the
        background, or at its next start when that backlog is full or the
        server stops first (the document stays `received` meanwhile); poll
        `/v1/documents/{id}/status` until `done` or `failed`. Re-submitting
        unchanged content is a no-op (`noop: true`) unless `force` is set.
        A new `document_date` on unchanged live content updates the date
        in place and still returns `noop: true`. Omit it to keep the date
        on an existing version.
        Changing or clearing refs on unchanged content requires `force`.
        Omit refs to keep them on retries or inherit them from the latest
        live completed version on new content. Newly supplied refs that
        change the stored set must use bound stores. If those stores share
        one domain, ingestion pins the document to it.
        Set `domain` to choose an existing domain for a new version. The service
        checks the exact ID first, then a unique case-insensitive display name.
        Choosing a domain requires extraction schema v4. Unchanged content
        already assigned to another domain returns `domain_conflict` even
        with `force`. A single product-ref pin on a new version must agree
        with the choice, including when the refs were inherited.
        `labels` selects an installed YAML preset under `labels.presets_dir`;
        omitted/empty uses built-in defaults. Shipped presets are general,
        meeting, documentation, mail, news, code and demo; custom names are
        accepted. Invalid or unknown presets fail before ingestion. The preset
        is stored with the document and reused after restart.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestRequest"
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                source:
                  type: string
                  description: identity override; defaults to the filename
                document_date:
                  $ref: "#/components/schemas/IngestDocumentDate"
                domain:
                  $ref: "#/components/schemas/IngestDomain"
                labels:
                  type: string
                  description: Installed label preset name; empty uses built-in defaults
                  pattern: '^[a-zA-Z0-9_-]*$'
                force:
                  type: string
                  description: '"true" or "1" re-runs unchanged content; all other values are false'
                products:
                  allOf:
                    - $ref: "#/components/schemas/IngestProducts"
                  description: Repeat the products field once per product ID.
                products_clear:
                  type: string
                  enum: ["true", "false"]
                  description: Set to "true" to clear refs. Omit the products field when clearing.
      responses:
        "202":
          description: queued for processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResponse"
        "200":
          description: No reprocessing. A supplied document date may have been updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResponse"
        "400":
          description: |
            Rejected input. Codes include `invalid_request` for a non-string
            domain or bad document date, `unknown_domain`, `ambiguous_domain`,
            `invalid_products`, and `products_unknown_store`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: |
            Product refs changed on unchanged content (`refs_changed_use_force`),
            the refs pin conflicts with the assigned domain (`domain_pin_conflict`),
            or the pinned domain no longer exists (`domain_missing`). An
            explicit domain can conflict with the exact version's domain or
            a new version's product-ref pin (`domain_conflict`), disappear
            before admission (`unknown_domain`), or require extraction schema
            v4 (`schema_not_v4`). Exact content still processing without an
            assigned domain returns `document_busy` when a domain is requested.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: body exceeds the upload cap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: no ingestion pipeline wired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: |
            Store or value-conversion failure, or a spool write failure
            (`error: ingest_unavailable`, `detail: could not persist submission`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: |
            Retryable admission failure: the spool is full (`error: ingest_busy`),
            or a submission needs a payload while a worker holds the document
            lock (`error: document_busy`). This includes date changes on
            unchanged content. Unchanged non-force submissions that keep the
            existing date can return a no-op while that version is processing.
            A failed domain lookup returns `store_error`.
          headers:
            Retry-After:
              description: seconds to wait before retrying a spool or worker lock failure
              schema:
                type: integer
                minimum: 0
                example: 30
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/domains:
    get:
      tags: [documents]
      operationId: listDomains
      summary: List domains for search and ask
      responses:
        "200":
          description: Domains ordered by id, including empty domains, with done document counts, product counts and binding status.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DomainCount"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/documents:
    get:
      tags: [documents]
      operationId: listDocuments
      summary: List documents
      description: Filters by effective document date before applying the limit. Malformed or inverted bounds return 400 invalid_request.
      parameters:
        - $ref: "#/components/parameters/DocumentDateSince"
        - $ref: "#/components/parameters/DocumentDateUntil"
        - name: domain
          in: query
          description: Optional domain slug; empty selects all. Applied before the limit.
          schema: { type: string, pattern: "^[a-z0-9-]{1,40}$" }
        - name: limit
          in: query
          description: defaults to 100, capped at 1000
          schema: { type: integer, minimum: 1, default: 100 }
        - name: status
          in: query
          description: Exact status filter; an unknown status yields an empty list.
          schema: { type: string, example: done }
      responses:
        "200":
          description: documents, most recently updated first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/documents/{id}:
    get:
      tags: [documents]
      operationId: getDocument
      summary: Get one document
      parameters:
        - $ref: "#/components/parameters/DocumentID"
      responses:
        "200":
          description: the document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
    delete:
      tags: [documents]
      operationId: deleteDocument
      summary: Delete a document (or its whole version chain)
      description: Removes the document with its chunks, fact edges and mentions, and prunes the entities left without relationships. Without the chain flag exactly one version is removed; with it, every version of the same source identity goes in one all-or-nothing transaction. There is no undo.
      parameters:
        - $ref: "#/components/parameters/DocumentID"
        - name: chain
          in: query
          required: false
          schema:
            type: string
            enum: ["1", "true", "0", "false"]
          description: "1/true removes every version of the same source; default: only this version"
      responses:
        "200":
          description: number of removed document versions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/documents/{id}/status:
    get:
      tags: [documents]
      operationId: getDocumentStatus
      summary: Get one document's pipeline status
      parameters:
        - $ref: "#/components/parameters/DocumentID"
      responses:
        "200":
          description: status, domain and error of the document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/documents/{id}/content:
    get:
      tags: [documents]
      operationId: getDocumentContent
      summary: Get one document's stored text rendered to HTML
      description: Reconstructs the document's stored chunks server-side (overlapping sentences skipped by offset, inter-chunk gaps normalized to paragraph breaks) and renders the markdown with raw HTML omitted and unsafe link/image destinations neutralized. Superseded versions typically have no stored text left.
      parameters:
        - $ref: "#/components/parameters/DocumentID"
      responses:
        "200":
          description: document metadata, the rendered HTML and the ordered chunk index
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentContent"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          description: Store or value-conversion failure, or markdown render failure (error render_error).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/Unavailable"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/products/{id}:
    get:
      tags: [products]
      operationId: getProduct
      summary: >-
        Look up a product by graph ID with active feature observations and up to three associated pages
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: "^[0-9a-f]{32}$" }
        - $ref: "#/components/parameters/ProductPageDomain"
        - $ref: "#/components/parameters/WithProductMentions"
        - $ref: "#/components/parameters/ProductMentionsLimit"
        - $ref: "#/components/parameters/WithProductTexts"
        - $ref: "#/components/parameters/ProductTextKeys"
      responses:
        "200":
          $ref: "#/components/responses/ProductDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/products:
    get:
      tags: [products]
      operationId: lookupProduct
      summary: >-
        Look up a product by exact store and source ID with active feature observations and up to three associated pages
      parameters:
        - name: store
          in: query
          required: true
          schema: { type: string }
        - name: product_id
          in: query
          required: true
          description: Full source product ID, including its store prefix.
          schema: { type: string }
        - $ref: "#/components/parameters/ProductPageDomain"
        - $ref: "#/components/parameters/WithProductMentions"
        - $ref: "#/components/parameters/ProductMentionsLimit"
        - $ref: "#/components/parameters/WithProductTexts"
        - $ref: "#/components/parameters/ProductTextKeys"
      responses:
        "200":
          $ref: "#/components/responses/ProductDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
    put:
      tags: [products]
      operationId: pushProduct
      summary: Replace one product and its released observations
      description: |
        Use one increasing sequence per store across snapshot imports, pushes and deletes.
        The request must be a single JSON object with exactly one seq and one record.
        The body is capped at 128 KiB and the record at 64 KiB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductPushEvent"
      responses:
        "200":
          $ref: "#/components/responses/ProductMutationApplied"
        "400":
          $ref: "#/components/responses/ProductMutationInvalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The edge rejected a cross-site or foreign-Origin request.
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ProductMutationConflict"
        "413":
          description: Body exceeds 128 KiB. The API returns a JSON error. The edge may return an HTML error page before forwarding.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: { error: body_too_large, detail: request body exceeds 131072 bytes }
            text/html:
              schema: { type: string }
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ProductMutationUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
    delete:
      tags: [products]
      operationId: removeProduct
      summary: Remove one product and advance the store's sequence
      description: Supply each query parameter exactly once. Deleting an absent product also advances the sequence.
      parameters:
        - name: product_id
          in: query
          required: true
          schema: { type: string, minLength: 1 }
          description: Full source product ID with a valid store prefix, a colon and a non-empty suffix.
        - name: seq
          in: query
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
          description: Next sequence in the same per-store sequence used by imports and pushes.
      responses:
        "200":
          $ref: "#/components/responses/ProductMutationApplied"
        "400":
          $ref: "#/components/responses/ProductMutationInvalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The edge rejected a cross-site or foreign-Origin request.
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ProductMutationConflict"
        "413":
          description: The edge returns an HTML error page for a request body above 128 KiB. This operation takes its inputs in the query string.
          content:
            text/html:
              schema: { type: string }
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ProductMutationUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/products/stores:
    get:
      tags: [products]
      operationId: listProductStores
      summary: List product store watermarks and the active release ID
      responses:
        "200":
          description: Store watermarks in store order. Wiped stores keep their sequence watermarks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductStores"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/products/search:
    post:
      tags: [products]
      operationId: findProducts
      summary: Find products by attribute meaning, feature value, or numeric bounds
      description: |
        With a non-blank query, ranks products by the cosine similarity of their best matching
        stored attribute text. Hits are candidates. Use the product lookup with with_texts
        to read the value, and feature mode for exact and numeric constraints.
        Disabled, unavailable and timed-out meaning search return HTTP 200 with empty hits.
        Partial results include hits from ready vectors and report stores awaiting materialization.

        In feature mode, searches observations carrying the active release ID. A value matches the
        feature kind's fold for a scalar or unsplit value, or the fold of a split item.
        Conflicting observations match independently. Numeric bounds use the feature's
        canonical unit and apply inclusively to exact observations from keys enabled
        for numeric search. A global numeric search reports stores excluded by this
        policy in `numeric_excluded_stores`. An unknown feature ID returns empty hits
        for either feature filter. Feature results are ordered by graph product ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductSearchRequest"
      responses:
        "200":
          description: Feature pages contain up to five matching edges per hit and 1 MiB of JSON. Query results contain up to three matching texts per hit and no cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductSearchResponse"
        "400":
          description: Invalid input, a feature with released keys in scope but none enabled for numeric search, or a stale cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                not_numeric:
                  value:
                    error: not_numeric
                    detail: "not_numeric: no released key supports numeric search for this feature in scope"
                stale_cursor:
                  value:
                    error: stale_cursor
                    detail: "stale_cursor: search filters, product snapshots, or the active release changed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          description: The embedder or graph failed during meaning search.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: { error: meaning_unavailable, detail: product meaning search failed }
        "503":
          $ref: "#/components/responses/Unavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/features:
    get:
      tags: [products]
      operationId: listProductFeatures
      summary: List features in the active release's registry
      responses:
        "200":
          description: Feature definitions in ID order, including release and numeric search configuration for each mapped store key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductFeatures"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/search:
    post:
      tags: [graph]
      operationId: search
      summary: Search entities, chunks or both
      description: >-
        Entities and chunks are searched through the Memgraph text indexes; when the embedder is enabled, entity hits fuse the text leg with entity-embedding vector hits (text recall is never dropped).
        Chunks are text-only in v0. Domain text filtering runs inside Tantivy before its hit cap and before ORDER BY/LIMIT; the scoped vector leg over-fetches 5x and post-filters, so it may return fewer hits.
        Name lookup in agent/MCP get_entity uses EntityKey folding (possessives and edge punctuation) at schema v4, and legacy case folding below v4. Unscoped ambiguous names return one candidate per domain.
        The date window applies to chunk hits within Tantivy's first approximately 1,000 matches. Entity hits ignore it. Malformed or inverted bounds return 400 invalid_request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "200":
          description: ranked hits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
  /v1/entities/{id}:
    get:
      tags: [graph]
      operationId: getEntity
      summary: Get an entity with its aliases and evidenced facts
      description: The date window filters fact evidence and its group counts. Co-mentions and hidden counts ignore the window. Malformed or inverted bounds return 400 invalid_request.
      parameters:
        - name: id
          in: path
          required: true
          description: entity id or entity key
          schema: { type: string }
        - $ref: "#/components/parameters/DocumentDateSince"
        - $ref: "#/components/parameters/DocumentDateUntil"
        - name: include_low_confidence
          in: query
          description: '"true" or "1" includes all typed facts when confirmed_only is false. Other values are false. By default, typed facts are visible if they meet the assert floor or the judge confirmed them.'
          schema: { type: string, default: "false" }
        - name: include_unverified
          in: query
          description: '"true" or "1" additionally includes marked candidates when facts.allow_unverified_reads is true (default false); otherwise the response sets unverified_ignored to true'
          schema: { type: string, default: "false" }
        - name: confirmed_only
          in: query
          description: '"true" or "1" returns only judge-confirmed typed facts at any confidence. This takes precedence over include_low_confidence and include_unverified, so candidates are excluded.'
          schema: { type: string, default: "false" }
      responses:
        "200":
          description: the entity view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entity"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/traverse:
    post:
      tags: [graph]
      operationId: traverse
      summary: Walk fact edges from a start entity
      description: The date window filters edge evidence on every hop. Hidden counts ignore it. Malformed or inverted bounds return 400 invalid_request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TraverseRequest"
      responses:
        "200":
          description: the reachable subgraph with evidence excerpts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraverseResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
  /v1/cypher:
    post:
      tags: [operator]
      operationId: queryCypher
      summary: Run a guarded read-only Cypher query
      description: |
        Operator route; not exposed through the edge (404 there).
        Exactly one statement; write clauses (`CREATE`, `MERGE`, `SET`,
        `DELETE`, `DETACH`, `REMOVE`, `DROP`, `ALTER`, `LOAD`) are
        rejected, `CALL` is limited to the `vector_search.` and
        `text_search.` procedure namespaces, and `UNION` is rejected (a
        per-branch LIMIT cannot enforce a post-union row cap). Queries
        without `LIMIT` gain `LIMIT $cypher_rows`; a LIMIT that is not a
        plain integer or `$cypher_rows`, or a numeric LIMIT above the cap,
        is rejected; `limit` tightens the injected cap and is clamped to
        `Limits.CypherRows`. Execution is bounded by
        `Limits.CypherTimeoutMS`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CypherRequest"
      responses:
        "200":
          description: query result; nodes/relationships become JSON objects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CypherResponse"
        "400":
          description: rejected query or query-level failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
        "504":
          description: query exceeded the configured timeout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
  /v1/agent/ask:
    post:
      tags: [agent]
      operationId: askAgent
      summary: Ask a bounded read-only agent
      description: |
        Runs the enabled agent within its step, context and time budgets.
        Returns an answer, optional server-rendered answer_html and raw tool
        evidence. A step/context budget reached without a final answer still
        returns 200 with the evidence gathered. A disabled agent returns 501
        before reading the body. Questions are trimmed and must not be empty.
        Domain scopes search, get_entity, get_chunks, traverse, list_documents,
        status, get_product, find_products and list_features. Out-of-scope
        entities and products are reported as not found. Out-of-scope chunks
        are reported missing. find_products and get_product inherit the ask
        domain and reject a different domain argument. get_product also filters
        its associated pages and catalogue passages to the ask domain.
        list_features uses keys from stores bound to the ask domain and omits
        features with no key in those stores.
        Cypher receives the scope in the system prompt without domain enforcement.
        Product search pages default to 10 hits, cap at 20 and may be shorter
        under the byte budget. Continuation uses the same filters and effective
        limit. The agent's get_product defaults with_mentions to true and
        returns exact identifier matches in passages from done documents.
        The agent's get_chunks defaults with_products to true and includes
        products linked to each chunk's done document as well as exact
        identifier matches. Document-linked products appear first. Both
        sources count toward products_total after deduplication and before
        products_limit. Each document contributes up to 50 URL owners across
        its source and redirect URLs. links_partial reports incomplete document links,
        and products_error reports code matching failures.
        The optional mentions_limit accepts integers from 1 to 20 and defaults
        to 5. To fit the result budget, get_product keeps the first page and
        first mention when available. It drops additional mentions first, then
        additional pages, then features. The omission counts are
        mentions_omitted_for_budget, pages_omitted_for_budget and features_omitted.
        It returns a tool error if the required result exceeds the budget.
        Feature listings project released stores and numeric-search support. They accept a
        case-insensitive substring query over feature IDs and names and report
        truncated and omitted when the result exceeds the byte budget.
      requestBody:
        $ref: "#/components/requestBodies/AskQuestion"
      responses:
        "200":
          description: Answer and tool evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentAnswer"
        "400":
          description: Malformed JSON or unrecognized generation field (invalid_json) or invalid question, domain or generation setting (invalid_request).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "501":
          $ref: "#/components/responses/AgentDisabled"
        "502":
          description: Provider or agent failure (agent_error), or GCP authentication failure (auth_permanent or auth_transient). Detail excludes endpoint and key secrets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                agent_error:
                  value: { error: agent_error, detail: agent provider request failed }
                auth_permanent:
                  value: { error: auth_permanent, detail: "auth_permanent: default GCE service account is missing" }
                auth_transient:
                  value: { error: auth_transient, detail: "auth_transient: GCE metadata token request timed out" }
        "504":
          description: Agent deadline exceeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: agent_timeout
                detail: the agent timed out before answering
  /v1/agent/answer:
    post:
      tags: [agent]
      operationId: answerAgent
      summary: Get a structured answer for a domain
      description: |
        Runs the read-only agent for one existing domain. The summary is
        unverified model text. Cards and passages contain graph facts and
        tool excerpts selected by the model's citations. The deadline
        covers the domain lookup, model turns and graph reads.
        Requires GKG_AGENT_ENABLED and GKG_AGENT_ANSWER_ENABLED.
      requestBody:
        $ref: "#/components/requestBodies/AnswerQuestion"
      responses:
        "200":
          description: Structured answer, possibly incomplete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentStructuredAnswer"
        "400":
          description: |
            Malformed JSON or an unrecognized generation field returns invalid_json.
            An invalid question, domain, or generation setting returns invalid_request.
            Invalid conversation context returns invalid_context. Domain error
            details are domain_required, invalid_domain, and unknown_domain.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "501":
          $ref: "#/components/responses/AgentDisabled"
        "502":
          description: Provider or agent failure (agent_error), credential failure (auth_permanent or auth_transient), or graph read failure (hydration_error).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "504":
          description: Agent deadline exceeded or request cancelled (agent_timeout).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/agent/ask/stream:
    post:
      tags: [agent]
      operationId: streamAgent
      summary: Ask the agent with Server-Sent Events
      description: |
        Same question and limits as /v1/agent/ask. Disabled-agent and request
        validation errors are JSON. A GCP credential failure while obtaining the
        first token returns JSON 502 before SSE headers are sent. Once the response
        starts, HTTP status stays 200, including agent/provider errors.
        Each named event has a JSON data payload: `tool` has name and arguments,
        `delta` has text, `done` has the authoritative full AgentAnswer (including
        answer_html when present), and `error` has error and detail. A terminal
        error is `agent_timeout` for deadline expiry, `auth_permanent` or
        `auth_transient` for a GCP auth failure, or `agent_error` for other failures.
        The stream sends `: ping` comment heartbeats every 15 seconds and stops
        on disconnect. With provider streaming off it remains SSE and sends tool
        and done events only, plus heartbeats or a terminal error. Clients should
        replace accumulated delta text with the authoritative done answer.
        Domain scope is enforced exactly as on the JSON ask endpoint.
      requestBody:
        $ref: "#/components/requestBodies/AskQuestion"
      responses:
        "200":
          description: SSE frames terminated by done or error; heartbeat comments carry no JSON payload.
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-cache] }
            X-Accel-Buffering:
              schema: { type: string, enum: ["no"] }
          content:
            text/event-stream:
              schema: { type: string }
              x-sse-events:
                tool:
                  type: object
                  required: [name, arguments]
                  properties:
                    name: { type: string }
                    arguments:
                      description: Raw JSON arguments, of any JSON type; invalid JSON is represented as a string. May be null.
                delta:
                  type: object
                  required: [text]
                  properties:
                    text: { type: string, description: Progressive answer fragment }
                done:
                  $ref: "#/components/schemas/AgentAnswer"
                error:
                  type: object
                  required: [error, detail]
                  properties:
                    error:
                      type: string
                      enum: [agent_error, agent_timeout, auth_permanent, auth_transient]
                    detail: { type: string }
              example: |
                : ping

                event: tool
                data: {"name":"search","arguments":{"query":"Ada"}}

                event: delta
                data: {"text":"Ada"}

                event: done
                data: {"answer":"Ada","answer_html":"<p>Ada</p>\n","evidence":[],"steps":1}

        "400":
          description: Malformed JSON or unrecognized generation field (invalid_json) or invalid question, domain or generation setting (invalid_request), before SSE starts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "501":
          $ref: "#/components/responses/AgentDisabled"
        "502":
          description: GCP credential failure before SSE headers are sent (auth_permanent or auth_transient).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                auth_permanent:
                  value: { error: auth_permanent, detail: "auth_permanent: default GCE service account is missing" }
                auth_transient:
                  value: { error: auth_transient, detail: "auth_transient: GCE metadata token request timed out" }
  /v1/agent/status:
    get:
      tags: [agent]
      operationId: getAgentStatus
      summary: Probe agent capabilities
      description: |
        Always registered, including when the agent is disabled. Returns 200
        with enabled=false, answer=false and stream=false when disabled. answer
        is true when structured answers (POST /v1/agent/answer) are enabled
        as well as the agent. stream is true only
        when the agent is enabled, provider streaming is configured, and the
        process has not memoized provider streaming as unsupported.
      responses:
        "200":
          description: Agent, streaming and generation capabilities for the configured model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /healthz:
    get:
      tags: [health]
      operationId: healthz
      summary: Process liveness probe
      description: Direct gkg returns JSON. The nginx edge answers this path itself with plain text, without login.
      security: []
      responses:
        "200":
          description: process is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
            text/plain:
              schema: { type: string, example: "ok\n" }
  /readyz:
    get:
      tags: [operator]
      operationId: readyz
      summary: Readiness probe (Memgraph connectivity)
      description: Direct gkg probe; not exposed through the edge (404 there).
      security: []
      responses:
        "200":
          description: dependencies reachable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
        "503":
          description: dependency unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /metrics:
    get:
      tags: [operator]
      operationId: metrics
      summary: Prometheus metrics
      description: Direct gkg scrape; not exposed through the edge (404 there). Registered when metrics are wired (always by gkg serve).
      security: []
      responses:
        "200":
          description: scrape
          content:
            text/plain:
              schema: { type: string }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Direct gkg access when GKG_API_KEY is set. Do not use through the nginx edge.
    basicAuth:
      type: http
      scheme: basic
      description: Through the nginx edge. Browser login is reused automatically; the edge supplies the internal bearer.
  requestBodies:
    AskQuestion:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AgentQuestion"
    AnswerQuestion:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AnswerQuestion"
  parameters:
    DocumentDateSince:
      name: since
      in: query
      required: false
      description: Inclusive lower bound on the effective document date (YYYY-MM-DD from the start of the UTC day, or RFC 3339 with an offset).
      schema:
        $ref: "#/components/schemas/DocumentDateSince"
    DocumentDateUntil:
      name: until
      in: query
      required: false
      description: Inclusive upper bound on the effective document date (YYYY-MM-DD through the end of the UTC day, or RFC 3339 with an offset).
      schema:
        $ref: "#/components/schemas/DocumentDateUntil"
    ProductPageDomain:
      name: domain
      in: query
      description: Optional domain slug for associated pages and catalogue passages. Empty includes all domains.
      schema: { type: string, pattern: "^([a-z0-9-]{1,40})?$" }
    WithProductMentions:
      name: with_mentions
      in: query
      description: Include catalogue passages from done documents with exact identifier matches.
      schema: { type: boolean, default: false }
    ProductMentionsLimit:
      name: mentions_limit
      in: query
      description: Maximum returned passages. The server validates this parameter on every request and applies it when with_mentions is true.
      schema: { type: integer, minimum: 1, maximum: 20, default: 5 }
    WithProductTexts:
      name: with_texts
      in: query
      description: Include stored product attribute texts.
      schema: { type: boolean, default: false }
    ProductTextKeys:
      name: text_keys
      in: query
      style: form
      explode: true
      description: Repeat this parameter to select exact source keys when with_texts is true.
      schema: { type: array, items: { type: string } }
    DocumentID:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: "^[0-9a-f]{32}$" }
  responses:
    AgentDisabled:
      description: Agent is disabled; returned before reading the request body.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: agent_disabled
            detail: the ask agent is not enabled on this server
    Unauthorized:
      description: Missing or invalid bearer token directly to gkg. The edge instead challenges for Basic login before proxying (its 401 body is not JSON).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BodyTooLarge:
      description: JSON body exceeds 1 MiB (error body_too_large).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    GatewayTimeout:
      description: Store operation exceeded its deadline.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ProductDetail:
      description: >-
        Product metadata, observations carrying the active release ID, and associated pages.
        With with_mentions=true, a successful enrichment adds mentions, mentions_total, mentions_keys, and mentions_partial.
        An enrichment failure adds only mentions_error and retains HTTP 200 with the product detail.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProductDetailWithOptionalMentions"
    ProductMutationApplied:
      description: The event applied or matched the latest applied event.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProductMutationResult"
    ProductMutationInvalid:
      description: Invalid JSON, product record, source ID, or query parameters (invalid_request).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ProductMutationConflict:
      description: The event was refused. Stale and conflicting sequences include the store's seen_seq.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProductMutationConflict"
    ProductMutationUnavailable:
      description: >-
        The graph store is unavailable or the write outcome is uncertain.
        For unknown_outcome, resend the same event with the same sequence.
      content:
        application/json:
          schema:
            type: object
            required: [error, detail]
            properties:
              error: { type: string, enum: [unknown_outcome, unavailable] }
              detail: { type: string }
    NotFound:
      description: No such document, entity, or product (error store_error).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: store or value-conversion failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: graph store not wired
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [error, detail]
      properties:
        error: { type: string }
        detail: { type: string }
    ProductPushEvent:
      type: object
      additionalProperties: false
      required: [seq, record]
      properties:
        seq: { type: integer, format: int64, minimum: 1 }
        record:
          $ref: "#/components/schemas/ProductPushRecord"
    ProductPushRecord:
      type: object
      additionalProperties: false
      required: [store, product_id, title, brand, category, subcategory, product_type, link, attributes, page_specs]
      properties:
        store: { type: string }
        product_id: { type: string, description: "The store followed by a colon and a non-empty suffix." }
        title: { type: string }
        brand: { type: string }
        category: { type: string }
        subcategory: { type: string }
        product_type: { type: string, nullable: true }
        link: { type: string }
        attributes:
          type: object
          maxProperties: 512
          additionalProperties: { type: string }
        page_specs:
          type: array
          nullable: true
          description: Validated on input. Observations are derived from attributes.
          items:
            type: object
            additionalProperties: false
            required: [label, value]
            properties:
              label: { type: string }
              value: { type: string }
    ProductMutationResult:
      type: object
      required: [status, product_id, id, seen_seq]
      properties:
        status: { type: string, enum: [created, updated, deleted, absent, duplicate] }
        product_id: { type: string }
        id: { type: string, pattern: "^[0-9a-f]{32}$" }
        seen_seq: { type: integer, format: int64 }
    ProductMutationConflict:
      type: object
      required: [error, detail]
      properties:
        error:
          type: string
          enum: [stale, seq_conflict, release_changed, release_not_materialized, store_not_bound, store_cap, retry, reimport_required]
        detail: { type: string }
        seen_seq: { type: integer, format: int64, description: Current store watermark for stale and seq_conflict. }
    Product:
      type: object
      required: [id, store, product_id, domain, title, brand, category, subcategory, link]
      properties:
        id: { type: string, pattern: "^[0-9a-f]{32}$" }
        store: { type: string }
        product_id: { type: string, description: Full source product ID. }
        domain: { type: string }
        title: { type: string }
        brand: { type: string }
        category: { type: string }
        subcategory: { type: string }
        product_type: { type: string }
        link: { type: string }
    ProductDetail:
      allOf:
        - $ref: "#/components/schemas/Product"
        - type: object
          required: [features, pages, pages_missing]
          properties:
            features:
              type: array
              items:
                $ref: "#/components/schemas/ProductEvidence"
            pages:
              type: array
              maxItems: 3
              description: >-
                Live, done documents explicitly referencing the product in any domain or matching its link in the store's bound domain.
                Matches are grouped by precedence, with explicit references first, exact URL matches next, and opaque source page-key matches last.
                A page key must have a single product owner in that domain. The page-key tier runs when fewer than three distinct identities are selected.
                An optional domain filters pages before the limit. Each tier sorts by newest update, then ascending document ID.
                Pages with the same source kind and canonical source count once. Derived page-key matches use a later snapshot than the product record.
              items:
                $ref: "#/components/schemas/ProductPage"
            pages_missing: { type: boolean, description: True when the pages array is empty and coverage is complete. }
            pages_partial:
              type: string
              enum: [index_too_large, index_unavailable]
              description: The page-key tier was unavailable and page-key coverage is unknown. Omitted when coverage is complete. When present, pages_missing is false.
            texts:
              type: array
              maxItems: 64
              description: Present with with_texts. At most 64 texts are returned. The encoded object containing texts and texts_omitted is capped at 32 KiB.
              items:
                $ref: "#/components/schemas/ProductText"
            texts_omitted:
              type: integer
              minimum: 1
              description: Number of matching texts excluded by the count or size limit. Omitted when all fit.
    ProductText:
      type: object
      required: [key, text, text_truncated, checked]
      properties:
        key: { type: string, description: Exact source attribute key. }
        text: { type: string, description: Stored attribute text limited to 2048 UTF-8 bytes. }
        text_truncated: { type: boolean, description: The original text exceeded the storage limit. }
        checked: { type: boolean, description: The store and source key are in the active release. }
    ProductDetailWithOptionalMentions:
      allOf:
        - $ref: "#/components/schemas/ProductDetail"
        - type: object
          properties:
            mentions:
              type: array
              maxItems: 20
              description: >-
                Matching chunks of done documents ordered by document source, document ID, and chunk sequence.
                Empty when there are no matches, the product's store is unbound, or there is no active release,
                subject to the global identifier limit.
              items:
                $ref: "#/components/schemas/ProductChunkMention"
            mentions_total:
              type: integer
              minimum: 0
              description: Matching chunks among checked candidates before the display limit.
            mentions_keys:
              type: integer
              minimum: 0
              maximum: 64
              description: Globally unambiguous product keys emitted into the search query.
            mentions_partial:
              type: boolean
              description: >-
                A candidate, byte, key, term, or query bound was reached, or a clause was dropped for a non-ASCII
                term or a token of 40 bytes or more. Candidate retrieval can miss a separator inside a stored
                letter run (151L-Z for 151LZ, A-B12345 for AB12345), whitespace inside a stored run
                (TC 2SL for TC2SL), NFKC-only forms such as fullwidth characters, case-mapping differences
                such as ß and İ, and tokens of 40 bytes or more, even when this field is false.
                Use gkg products mentions-scan for an exact offline scan.
            mentions_error:
              type: string
              enum: [index_too_large, index_unavailable, search_unavailable]
              description: >-
                index_too_large means the global index exceeds 200,000 raw identifier values, including when the
                requested product belongs to an unbound store. index_unavailable means the index load failed or timed out.
                search_unavailable means candidate search or matching failed or timed out.
    ProductChunkMention:
      type: object
      required: [doc_id, chunk_id, seq, doc_title, doc_source, domain, excerpt, matched]
      properties:
        doc_id: { type: string }
        chunk_id: { type: string }
        seq: { type: integer }
        doc_title: { type: string }
        doc_source: { type: string }
        document_date: { type: string, format: date-time, description: Effective date of the document in UTC. }
        document_date_source: { type: string, enum: [caller, ingest], description: Origin of the effective date. }
        domain: { type: string }
        excerpt:
          type: string
          description: A UTF-8 excerpt of at most 300 bytes that contains the start of the first match for this product.
        matched:
          type: array
          maxItems: 8
          description: Distinct folded identifier values sorted by feature and value.
          items:
            type: object
            required: [feature, value]
            properties:
              feature: { type: string, enum: [catalogue_code, product_reference] }
              value: { type: string }
    ProductPage:
      type: object
      required: [id, title, source, updated_at, via, chunk_ids, chunk_count]
      properties:
        id: { type: string }
        title: { type: string }
        source: { type: string, description: Stored document source. }
        updated_at: { type: string, format: date-time }
        via:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          description: Evidence from the evaluated tiers, in order of precedence. URL evidence may be absent when explicit refs fill all three page slots.
          items: { type: string, enum: [ref, url, page] }
        chunk_ids:
          type: array
          maxItems: 3
          description: First chunk IDs for the selected document, ordered by sequence and then chunk ID.
          items: { type: string }
        chunk_count: { type: integer, minimum: 0, description: Total chunks in the selected document. }
    ProductFeature:
      type: object
      required: [id, name, kind, cardinality, canonical_unit]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [text, enum, code, measure] }
        cardinality: { type: string, enum: [single, multi] }
        canonical_unit: { type: string, nullable: true }
    ProductFeatureRev:
      allOf:
        - $ref: "#/components/schemas/ProductFeature"
        - type: object
          required: [key, rev, definition, definition_digest]
          properties:
            key: { type: string }
            rev: { type: string }
            definition: { type: string }
            definition_digest: { type: string }
            replaces: { type: string }
    ProductEvidence:
      type: object
      required: [feature, source_key, raw, split_status, conflict, numeric, release_id]
      properties:
        feature:
          $ref: "#/components/schemas/ProductFeatureRev"
        source_key: { type: string }
        raw: { type: string }
        items: { type: array, items: { type: string } }
        split_status: { type: string }
        typed:
          $ref: "#/components/schemas/ProductMeasure"
        conflict: { type: boolean }
        numeric: { type: boolean, description: The store key is configured for numeric search. }
        release_id: { type: string }
    ProductMeasure:
      type: object
      required: [status, qualifier, lo, hi, inclusive, unit_in, lo_canonical, hi_canonical, canonical_unit]
      properties:
        status: { type: string }
        qualifier: { type: string, nullable: true }
        lo: { type: string, nullable: true }
        hi: { type: string, nullable: true }
        inclusive: { type: boolean, nullable: true }
        unit_in: { type: string, nullable: true }
        lo_canonical: { type: string, nullable: true }
        hi_canonical: { type: string, nullable: true }
        canonical_unit: { type: string, nullable: true }
    ProductStores:
      type: object
      required: [active_release_id, stores]
      properties:
        active_release_id: { type: string, nullable: true }
        stores:
          type: array
          items:
            $ref: "#/components/schemas/ProductStoreWatermark"
    ProductStoreWatermark:
      type: object
      required: [store, domain, snapshot_seq, seen_seq, wiped_seq, wiped, release_id, product_count, edge_count, imported_at]
      properties:
        store: { type: string }
        domain: { type: string }
        snapshot_seq: { type: integer, format: int64, description: Sequence of the last materialized snapshot. }
        seen_seq: { type: integer, format: int64, description: Highest admitted sequence including unchanged imports. }
        wiped_seq: { type: integer, format: int64, description: Highest admitted sequence when last wiped. }
        wiped: { type: boolean, description: The store was wiped and has had no subsequent import. }
        release_id: { type: string, nullable: true, description: Release of the materialized snapshot. }
        product_count: { type: integer, format: int64 }
        edge_count: { type: integer, format: int64 }
        imported_at: { type: string, format: date-time, nullable: true }
        materialized_activation_seq: { type: integer, format: int64, nullable: true, description: Activation sequence stamped by the last successful import. }
        pushed_at: { type: string, format: date-time, nullable: true, description: Time of the last applied product mutation. }
    ProductFeatures:
      type: object
      required: [active_release_id, features]
      properties:
        active_release_id: { type: string, nullable: true }
        features:
          type: array
          items:
            $ref: "#/components/schemas/ProductFeatureListing"
    ProductFeatureListing:
      allOf:
        - $ref: "#/components/schemas/ProductFeature"
        - type: object
          required: [released, keys]
          properties:
            released: { type: boolean, description: At least one mapped key is released. }
            keys:
              type: array
              items:
                $ref: "#/components/schemas/ProductFeatureKey"
    ProductFeatureKey:
      type: object
      required: [store, source_key, numeric_search, released]
      properties:
        store: { type: string }
        source_key: { type: string }
        numeric_search: { type: boolean }
        released: { type: boolean }
    ProductSearchRequest:
      oneOf:
        - $ref: "#/components/schemas/ProductFeatureSearchRequest"
        - $ref: "#/components/schemas/ProductQuerySearchRequest"
    ProductFeatureSearchRequest:
      type: object
      required: [feature]
      properties:
        domain: { type: string, description: Optional exact domain ID. }
        query: { type: string, nullable: true, pattern: '^\s*$', description: Omit or leave blank to select feature mode. }
        feature: { type: string, minLength: 1, description: Feature ID from GET /v1/features. }
        value: { type: string, description: Value for exact fold matching. }
        min: { type: string, description: Inclusive non-negative decimal lower bound with up to six fractional digits. }
        max: { type: string, description: Inclusive non-negative decimal upper bound with up to six fractional digits. }
        limit: { type: integer, minimum: 1, maximum: 50, default: 20 }
        cursor:
          type: string
          description: Opaque continuation cursor from the previous page. Changing the domain, feature, value or bounds, or page size returns stale_cursor.
      oneOf:
        - required: [value]
          not:
            anyOf:
              - required: [min]
              - required: [max]
        - anyOf:
            - required: [min]
            - required: [max]
          not:
            required: [value]
    ProductQuerySearchRequest:
      type: object
      required: [query]
      properties:
        query: { type: string, pattern: '\S', description: Query with 1–500 Unicode characters after trimming whitespace. }
        domain: { type: string, description: Optional exact domain ID. }
        limit: { type: integer, minimum: 1, maximum: 20, default: 10, nullable: true }
        feature: { type: string, nullable: true, pattern: '^\s*$' }
        value: { type: string, nullable: true, pattern: '^\s*$' }
        min: { type: string, nullable: true, pattern: '^\s*$' }
        max: { type: string, nullable: true, pattern: '^\s*$' }
        cursor: { type: string, nullable: true, pattern: '^\s*$' }
    ProductSearchResponse:
      oneOf:
        - $ref: "#/components/schemas/ProductFeatureSearchResponse"
        - $ref: "#/components/schemas/ProductQuerySearchResponse"
    ProductFeatureSearchResponse:
      type: object
      required: [hits]
      not: { required: [mode] }
      properties:
        hits:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/ProductHit"
        cursor:
          type: string
          description: Opaque cursor for the next page. Omitted when there are no more results.
        numeric_excluded_stores:
          type: array
          items: { type: string }
          description: Stores with released keys for the feature and no numeric-enabled released key, in store order. Present for global numeric searches with at least one excluded store.
    ProductQuerySearchResponse:
      type: object
      required: [mode, hits, exhausted, candidates_truncated, meaning_status, stores_not_materialized]
      properties:
        mode: { type: string, enum: [query] }
        hits:
          type: array
          maxItems: 20
          description: Descending score, then ascending graph product ID for ties.
          items:
            $ref: "#/components/schemas/ProductQueryHit"
        exhausted: { type: boolean, description: The candidate count reached the vector index size. }
        candidates_truncated: { type: boolean, description: Candidate search stopped at the 16384-vector cap before exhausting the index. }
        meaning_status:
          type: string
          enum: [disabled, unavailable, timeout, partial, ok]
          description: Unavailable covers unsupported embedding spaces and absent or incompatible indexes. Partial covers missing vectors or stores awaiting materialization.
        stores_not_materialized:
          type: array
          items: { type: string }
          description: Bound stores in scope whose product texts have yet to be materialized.
    ProductQueryHit:
      type: object
      required: [id, store, product_id, domain, title, brand, score, matched]
      properties:
        id: { type: string }
        store: { type: string }
        product_id: { type: string }
        domain: { type: string }
        title: { type: string }
        brand: { type: string }
        score: { type: number, description: Best cosine similarity among the product's matching texts. }
        matched:
          type: array
          maxItems: 3
          items:
            $ref: "#/components/schemas/MatchedProductText"
    MatchedProductText:
      allOf:
        - $ref: "#/components/schemas/ProductText"
        - type: object
          required: [excerpt_cut, similarity, text_id]
          properties:
            text: { type: string, maxLength: 200, description: Excerpt of the stored attribute text. }
            excerpt_cut: { type: boolean, description: The excerpt is shorter than the stored text. }
            similarity: { type: number, description: Cosine similarity computed as one minus distance. }
            text_id: { type: string, description: Vector identifier of the matched text. }
    ProductHit:
      type: object
      required: [product, evidence, evidence_truncated]
      properties:
        product:
          $ref: "#/components/schemas/Product"
        evidence:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/ProductEvidence"
        evidence_truncated: { type: boolean, description: Matching evidence was omitted due to the per-hit edge limit or response size. }
    IngestRequest:
      type: object
      description: Exactly one non-empty url (trimmed) or text is required. Source, labels, force, products, document_date and domain are optional.
      oneOf:
        - required: [url]
          properties:
            url: { minLength: 1 }
            text: { enum: [""] }
        - required: [text]
          properties:
            text: { minLength: 1 }
            url: { pattern: '^\s*$' }
      properties:
        url: { type: string, format: uri }
        text: { type: string }
        source:
          type: string
          description: Identity override; defaults to the submitted URL (url) or the first 8 hex characters of the cleaned content SHA-256 (text)
        document_date:
          $ref: "#/components/schemas/IngestDocumentDate"
        domain:
          $ref: "#/components/schemas/IngestDomain"
        labels:
          type: string
          description: Installed label preset name; empty uses built-in defaults. Custom presets are allowed.
          pattern: '^[a-zA-Z0-9_-]*$'
        force:
          type: boolean
          default: false
        products:
          $ref: "#/components/schemas/IngestProducts"
    IngestDomain:
      type: string
      description: >
        Existing domain ID or unique case-insensitive exact name. The value is
        trimmed and an exact ID wins over a name match. Empty or omitted selects
        automatic detection. GET /v1/domains lists available domains.
    IngestDocumentDate:
      type: string
      description: >
        Source date as YYYY-MM-DD (midnight UTC) or RFC 3339 with an offset.
        The date is normalized to UTC and must be in 1900 or later and at
        most 24 hours ahead of the server clock. An empty value behaves like omission.
    IngestProducts:
      type: array
      description: Unique store-prefixed product IDs, at most 1 KiB each. Pass an empty array to clear refs.
      maxItems: 50
      uniqueItems: true
      items:
        type: string
        description: A store prefix followed by a colon and a non-empty suffix.
    IngestResponse:
      type: object
      required: [document_id, noop]
      properties:
        document_id: { type: string }
        noop: { type: boolean }
    DomainCount:
      type: object
      required: [id, name, documents, products, products_bound]
      properties:
        id: { type: string }
        name: { type: string }
        documents: { type: integer, description: Number of done documents }
        products: { type: integer, description: Number of products in the domain }
        products_bound: { type: boolean, description: Whether any product store is bound to the domain }
    Document:
      type: object
      required: [id, source_kind, source, status, created_at, updated_at]
      properties:
        domain:
          type: string
          description: Domain slug; empty selects all on requests and denotes unassigned legacy data on views.
        id: { type: string }
        source_kind: { type: string, enum: [url, file, text] }
        source: { type: string }
        final_url: { type: string }
        title: { type: string }
        title_source:
          type: string
          enum: [caller, pdf, html, frontmatter, h1, slug, ""]
          description: Origin of the stored title. Empty means no origin is recorded.
        status:
          type: string
          enum:
            [
              received,
              fetched,
              chunked,
              extracted,
              merged,
              verifying,
              done,
              failed,
              superseded,
            ]
        error: { type: string }
        labels: { type: string }
        products:
          type: array
          description: Canonical list of store-prefixed product IDs recorded on this document version.
          items: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        document_date:
          type: string
          format: date-time
          description: Effective date in UTC. Uses the caller date when set, then the version ingest time or the creation time.
        document_date_source:
          type: string
          enum: [caller, ingest]
          description: Origin of the effective date.
        supersedes: { type: string }
    DocumentsResponse:
      type: object
      required: [documents]
      properties:
        documents:
          type: array
          items:
            $ref: "#/components/schemas/Document"
    Status:
      type: object
      required: [id, status, domain, updated_at]
      properties:
        id: { type: string }
        domain: { type: string, description: "Assigned domain ID, or an empty string before assignment." }
        status:
          type: string
          enum:
            [
              received,
              fetched,
              chunked,
              extracted,
              merged,
              verifying,
              done,
              failed,
              superseded,
            ]
        error: { type: string }
        updated_at: { type: string, format: date-time }
        products:
          type: array
          description: Canonical list of store-prefixed product IDs recorded on this document version.
          items: { type: string }
    DocumentDateSince:
      type: string
      description: Inclusive lower bound on the effective document date. Use YYYY-MM-DD (start of the UTC day) or an RFC 3339 timestamp with an offset. The UTC year must be 1900 or later.
      example: "2024-01-01"
    DocumentDateUntil:
      type: string
      description: Inclusive upper bound on the effective document date. Use YYYY-MM-DD (through the end of the UTC day) or an RFC 3339 timestamp with an offset. The UTC year must be 1900 or later.
      example: "2024-12-31"
    SearchRequest:
      type: object
      required: [query]
      properties:
        domain:
          type: string
          pattern: "^([a-z0-9-]{1,40})?$"
          description: Optional domain slug; empty selects all.
        query: { type: string }
        kind:
          type: string
          enum: [entity, chunk, auto]
          default: auto
        limit:
          type: integer
          default: 20
          description: Non-positive values select the default (20); values above 100 are capped at 100
        since:
          $ref: "#/components/schemas/DocumentDateSince"
        until:
          $ref: "#/components/schemas/DocumentDateUntil"
    SearchResponse:
      type: object
      required: [hits]
      properties:
        hits:
          type: array
          items:
            $ref: "#/components/schemas/Hit"
    Hit:
      type: object
      required: [kind, id, title, score, snippet]
      properties:
        domain:
          type: string
          description: Domain slug; empty = unassigned legacy data.
        kind: { type: string, enum: [entity, chunk] }
        id: { type: string }
        title: { type: string }
        score: { type: number, format: double }
        snippet: { type: string }
        document_id:
          type: string
          description: chunk hits only — the owning document id
        document_date: { type: string, format: date-time, description: Effective date of the chunk's document in UTC. }
        document_date_source: { type: string, enum: [caller, ingest], description: Origin of the effective date. }
    DocumentContent:
      type: object
      required: [document, html, chunks]
      properties:
        document:
          $ref: "#/components/schemas/Document"
        html:
          type: string
          description: server-rendered markdown; raw HTML never passes through
        chunks:
          type: array
          items:
            $ref: "#/components/schemas/ChunkRef"
    ChunkRef:
      type: object
      required: [id, seq, start, end]
      properties:
        id: { type: string }
        seq: { type: integer }
        start: { type: integer }
        end: { type: integer }
    DeleteResult:
      type: object
      required: [deleted]
      properties:
        deleted:
          type: integer
          minimum: 0
          description: how many document versions were removed
    EntityRef:
      type: object
      required: [id, key, name, type, domain]
      properties:
        id: { type: string }
        key: { type: string }
        name: { type: string }
        type: { type: string }
        domain: { type: string, description: Entity's domain slug; empty when unassigned. }
    CoMention:
      allOf:
        - $ref: "#/components/schemas/EntityRef"
        - type: object
          required: [shared_chunks]
          properties:
            shared_chunks:
              type: integer
              minimum: 1
              description: number of distinct chunks mentioning both entities
    Fact:
      type: object
      required:
        [
          rel,
          other,
          confidence,
          low_confidence,
          outgoing,
          doc_id,
          chunk_id,
          excerpt,
        ]
      properties:
        rel: { type: string }
        other:
          $ref: "#/components/schemas/EntityRef"
        confidence: { type: number, format: double }
        judge: { type: string, enum: ["", confirmed, unclear] }
        unverified:
          type: boolean
          description: True for an included candidate; judge is present (empty for unjudged). Omitted for typed edges.
        low_confidence:
          type: boolean
          description: Whether the extractor score was below the assert floor.
        outgoing: { type: boolean }
        doc_id: { type: string }
        document_date: { type: string, format: date-time, description: Effective date of the document in UTC. }
        document_date_source: { type: string, enum: [caller, ingest], description: Origin of the effective date. }
        chunk_id: { type: string }
        excerpt: { type: string }
    Entity:
      type: object
      required: [id, key, name, type, domain, aliases, mention_count, facts, together]
      properties:
        requested:
          type: string
          description: Retired entity ID or key supplied in the request. Present only after a merge redirect.
        resolved_via:
          type: string
          enum: [merged]
          description: Present when a merge redirect selected the returned entity.
        id: { type: string }
        key: { type: string }
        name: { type: string }
        type: { type: string }
        domain: { type: string, description: Entity's domain slug; empty when unassigned. }
        aliases:
          type: array
          items: { type: string }
        mention_count: { type: integer }
        hidden:
          $ref: "#/components/schemas/HiddenCounts"
        unverified_ignored:
          type: boolean
          description: True only when include_unverified was requested but facts.allow_unverified_reads is false.
        facts:
          type: array
          items:
            $ref: "#/components/schemas/Fact"
        together:
          type: array
          maxItems: 10
          description: co-mentioned entities, ordered by shared chunks descending, mention count descending, then key ascending
          items:
            $ref: "#/components/schemas/CoMention"
    HiddenCounts:
      type: object
      description: >-
        Counts unjudged and unclear FactCandidate records and RejectedFact audits
        whose head_key or tail_key matches the viewed entity (the start entity for traversal).
        Each distinct (head_key, rel, tail_key) counts once per state across chunks.
        Counts are independent of read filters and exclude typed edges suppressed by
        confirmed_only or the default low-confidence filter. Omitted when all counts are zero.
      required: [unclear, unjudged, rejected]
      properties:
        unclear: { type: integer, minimum: 0 }
        unjudged: { type: integer, minimum: 0 }
        rejected: { type: integer, minimum: 0 }
    TraverseRequest:
      type: object
      required: [entity]
      properties:
        entity:
          type: string
          description: start entity id or key
        relation: { type: string }
        direction:
          type: string
          enum: [out, in, both]
          default: out
        depth:
          type: integer
          minimum: 0
          maximum: 2
          default: 1
          description: 0 selects the default (1); otherwise must be 1 or 2
        limit:
          type: integer
          minimum: 0
          default: 50
          description: 0 selects the default (50); values above 200 are capped; negative values are rejected
        include_low_confidence:
          type: boolean
          default: false
          description: Includes all typed edges when confirmed_only is false. By default, typed edges are visible if they meet the assert floor or the judge confirmed them.
        include_unverified:
          type: boolean
          default: false
          description: Additionally includes marked candidate facts (including low-confidence facts) only when facts.allow_unverified_reads is true; otherwise unverified_ignored is true. Candidate facts appear at the depth where found, but their far endpoints are not enqueued for expansion. Rejected audits are never returned as edges.
        confirmed_only:
          type: boolean
          default: false
          description: Traverses only judge-confirmed typed edges at any confidence on every hop. This takes precedence over include_low_confidence and include_unverified, so candidates are excluded.
        since:
          $ref: "#/components/schemas/DocumentDateSince"
        until:
          $ref: "#/components/schemas/DocumentDateUntil"
    Edge:
      type: object
      required:
        [from, to, rel, confidence, low_confidence, doc_id, chunk_id, excerpt]
      properties:
        from: { type: string }
        to: { type: string }
        rel: { type: string }
        confidence: { type: number, format: double }
        judge: { type: string, enum: ["", confirmed, unclear] }
        unverified:
          type: boolean
          description: True for an included candidate; judge is present (empty for unjudged). Omitted for typed edges.
        low_confidence:
          type: boolean
          description: Whether the extractor score was below the assert floor.
        doc_id: { type: string }
        document_date: { type: string, format: date-time, description: Effective date of the document in UTC. }
        document_date_source: { type: string, enum: [caller, ingest], description: Origin of the effective date. }
        chunk_id: { type: string }
        excerpt: { type: string }
    TraverseResponse:
      type: object
      required: [nodes, edges]
      properties:
        requested:
          type: string
          description: Retired start entity ID or key supplied in the request. Present only after a merge redirect.
        resolved_via:
          type: string
          enum: [merged]
          description: Present when a merge redirect selected the traversal start.
        hidden:
          $ref: "#/components/schemas/HiddenCounts"
        unverified_ignored:
          type: boolean
          description: True only when include_unverified was requested but facts.allow_unverified_reads is false.
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/EntityRef"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/Edge"
    CypherRequest:
      type: object
      required: [query]
      properties:
        query: { type: string }
        limit:
          type: integer
          description: Positive values tighten the row cap; non-positive or above-cap values use Limits.CypherRows (default 1000)
    CypherResponse:
      type: object
      required: [columns, rows]
      properties:
        columns:
          type: array
          items: { type: string }
        rows:
          type: array
          items:
            type: object
            additionalProperties: true
    AgentQuestion:
      type: object
      required: [question]
      properties:
        domain:
          type: string
          pattern: "^([a-z0-9-]{1,40})?$"
          description: Optional domain slug; empty selects all.
        question:
          type: string
          minLength: 1
          description: Trimmed before use; whitespace-only questions are rejected.
          example: What does the graph say about Ada?
        generation:
          $ref: "#/components/schemas/AgentGeneration"
    AgentGeneration:
      type: object
      description: Optional settings applied to every model turn for this ask.
      additionalProperties: false
      properties:
        temperature: { type: number, minimum: 0, maximum: 2, default: 0 }
        top_p: { type: number, minimum: 0, maximum: 1, description: Omit for the provider default. }
        top_k: { type: integer, minimum: 1, description: Sampling top-k. Available when agent status reports generation.top_k as true. }
        reasoning_effort:
          type: string
          enum: [none, high, max]
          description: Choose from generation.reasoning_efforts in agent status. Omit for the provider default.
    AgentAnswer:
      type: object
      required: [answer, evidence, steps]
      properties:
        answer: { type: string }
        answer_html:
          type: string
          description: Optional server-rendered Markdown answer with raw HTML omitted and unsafe destinations neutralized.
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/AgentEvidence"
        steps:
          type: integer
          minimum: 0
          description: Model turns requesting tools; budget-skipped calls may still appear in evidence.
    AgentEvidence:
      type: object
      required: [tool]
      properties:
        tool: { type: string }
        arguments:
          description: Raw JSON tool arguments, of any JSON type; invalid JSON is represented as a string. May be null or omitted.
        result:
          description: Raw JSON tool result or tool error, of any JSON type; may be null or omitted.
    AnswerQuestion:
      type: object
      required: [question, domain]
      properties:
        question:
          type: string
          minLength: 1
          description: Trimmed before use. Whitespace-only questions are rejected.
          example: Which lamp is lighter?
        domain:
          type: string
          pattern: "^[a-z0-9-]{1,40}$"
          description: Slug of an existing domain.
          example: catalog
        context:
          type: object
          description: Conversation history supplied by the caller must come from the same domain.
          properties:
            product_ids:
              type: array
              maxItems: 10
              description: IDs become citable when a tool returns them during this request.
              items:
                type: string
                pattern: "^[a-z0-9][a-z0-9.-]{0,62}:"
                description: Snapshot import identity with a prefix bound to the requested domain. Up to 1 KiB per ID, with an empty suffix allowed.
                example: "shop.example:1031"
            history:
              type: array
              maxItems: 6
              description: At most 4 KiB of turn text in total.
              items:
                type: object
                required: [role, text]
                properties:
                  role: { type: string, enum: [user, assistant] }
                  text: { type: string, maxLength: 1000 }
        generation:
          $ref: "#/components/schemas/AgentGeneration"
    AgentStructuredAnswer:
      type: object
      required: [contract, domain, summary, products, alternatives, comparison, passages, complete, warnings, dropped, as_of, trace]
      properties:
        contract: { type: string, enum: [gkg-answer/1] }
        domain: { type: string }
        summary: { type: string, description: Unverified model text with citation marks removed. }
        products:
          type: array
          maxItems: 10
          description: Cited matches and products the shopper asked about, in first match-citation order.
          items:
            $ref: "#/components/schemas/AgentProductCard"
        alternatives:
          type: array
          maxItems: 10
          description: |
            Cited alternatives in first alternative-citation order. The two
            lists share a limit of ten cards, with products taking priority.
            A product cited in both roles appears in products only.
          items:
            $ref: "#/components/schemas/AgentProductCard"
        comparison:
          type: object
          nullable: true
          description: Null when products contains fewer than two cards.
          required: [product_ids, rows]
          properties:
            product_ids: { type: array, items: { type: string } }
            rows:
              type: array
              maxItems: 12
              description: Features present on at least two cards in products, in feature ID order.
              items:
                type: object
                required: [feature_id, cells]
                properties:
                  feature_id: { type: string }
                  cells:
                    type: object
                    description: Evidence for each product ID. The cell is null when the feature is absent on that card.
                    additionalProperties:
                      type: array
                      nullable: true
                      items:
                        $ref: "#/components/schemas/ProductEvidence"
        passages:
          type: array
          maxItems: 10
          description: Cited chunks in first-citation order.
          items:
            $ref: "#/components/schemas/AgentPassage"
        complete:
          type: boolean
          description: False when no answer could be produced, the final turn failed, or the reply was truncated.
        warnings:
          type: array
          items: { type: string, enum: [no_answer, final_turn_failed, truncated, budget_final] }
        dropped:
          type: object
          description: Citations beyond the caps are omitted from both counts.
          required: [not_returned, not_found]
          properties:
            not_returned: { type: integer, minimum: 0, description: Citation tokens absent from the tool results. }
            not_found: { type: integer, minimum: 0, description: Selected product cards or passages missing from the scoped graph reads. }
        as_of:
          type: object
          required: [release_id, activation_seq, stores]
          properties:
            release_id: { type: string, nullable: true }
            activation_seq: { type: integer, nullable: true }
            stores:
              type: array
              items:
                type: object
                required: [store, materialized_activation_seq]
                properties:
                  store: { type: string }
                  materialized_activation_seq: { type: integer, nullable: true }
        trace:
          type: object
          required: [steps, tools, ms]
          properties:
            steps: { type: integer, minimum: 0, description: Model turns requesting tools. }
            tools:
              type: array
              description: Tool names in call order.
              items: { type: string }
            ms: { type: integer, minimum: 0, description: Elapsed server time in milliseconds. }
    AgentProductCard:
      type: object
      required: [product_id, id, store, domain, title, brand, category, subcategory, product_type, link, features, features_omitted, passage_ids, commerce]
      properties:
        product_id: { type: string, description: Store-prefixed source product ID. }
        id: { type: string, description: Graph product ID. }
        store: { type: string }
        domain: { type: string }
        title: { type: string }
        brand: { type: string }
        category: { type: string }
        subcategory: { type: string }
        product_type: { type: string, nullable: true }
        link: { type: string }
        features:
          type: array
          maxItems: 40
          items:
            $ref: "#/components/schemas/ProductEvidence"
        features_omitted: { type: integer, minimum: 0 }
        passage_ids: { type: array, items: { type: string }, description: Cited chunk IDs linked to this card. }
        commerce: { type: object, nullable: true, enum: [null], description: Reserved for commerce data. }
    AgentPassage:
      type: object
      required: [chunk_id, document_id, document_title, source, document_date, document_date_source, excerpts, links]
      properties:
        chunk_id: { type: string }
        document_id: { type: string }
        document_title: { type: string }
        source: { type: string }
        document_date: { type: string, format: date-time, nullable: true }
        document_date_source:
          type: string
          nullable: true
          description: Source of the effective document date. Null when the date is absent.
        excerpts:
          type: array
          description: Distinct texts as returned by the tools, attributed to the first tool that returned each text.
          items:
            type: object
            required: [tool, text]
            properties:
              tool: { type: string }
              text: { type: string }
              truncated: { type: boolean, enum: [true], description: Present when get_chunks reported truncation. }
        links:
          type: array
          description: Associations from the tools to cards in either products or alternatives.
          items:
            type: object
            required: [product_id]
            properties:
              product_id: { type: string }
              via: { type: array, items: { type: string }, description: Association sources reported by get_chunks. }
              kind: { type: string, enum: [page, mention], description: Association type reported by get_product. }
              outside_returned_text: { type: boolean, enum: [true], description: Present when get_chunks reported this field. }
    AgentStatus:
      type: object
      required: [enabled, answer, stream, generation]
      properties:
        enabled: { type: boolean }
        answer: { type: boolean, description: Both the agent and structured answers are enabled. }
        stream: { type: boolean }
        generation:
          type: object
          required: [top_k, reasoning_efforts]
          properties:
            top_k: { type: boolean, description: Operator has enabled sampling top-k. }
            reasoning_efforts:
              type: array
              items: { type: string, enum: [none, high, max] }
              description: Allowed explicit values for the configured model. An empty list means only the provider default is available.
