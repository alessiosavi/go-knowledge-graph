openapi: 3.0.3
info:
  title: gkg — Go Knowledge Graph API
  version: v0.1.0
  description: |
    REST surface of gkg: ingestion, documents, search, entity views, traversal,
    a guarded read-only Cypher endpoint, and the bounded read-only ask agent.
    The relative server URL uses the same origin through the nginx edge or
    directly to gkg. Through the edge, "Try it out" reuses the browser's Basic
    login; do not authorize a bearer there (the edge would reject it). The edge
    replaces the Basic Authorization header with its internal bearer token.
    Direct requests require `Authorization: Bearer <key>` when `GKG_API_KEY`
    is set; health probes, metrics and the static UI/docs shells are exempt.
    Operator routes are not exposed through the edge (404 there).
    `/mcp` is MCP streamable HTTP, not REST, and uses the same authentication;
    see docs/agent-setup.md for client setup.
    Body sizes are capped by configuration (`Ingest.MaxUploadMB` for ingestion,
    1 MiB for other JSON endpoints, including ask); Cypher row count and timeout
    are capped by `Limits.CypherRows` / `Limits.CypherTimeoutMS`.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: /
    description: Same origin, through the nginx edge or directly to gkg
security:
  - bearerAuth: []
  - basicAuth: []
tags:
  - name: documents
    description: Ingest, read and remove document versions
  - name: graph
    description: Search entities and chunks, inspect evidence and traverse facts
  - name: agent
    description: Bounded read-only question answering and streaming
  - name: health
    description: Process liveness
  - name: operator
    description: Direct gkg access only; not exposed through the edge (404 there)
paths:
  /v1/admin/rebuild:
    post:
      tags: [operator]
      operationId: rebuildDocuments
      summary: Rebuild completed documents (operator route)
      description: |
        Operator route; not exposed through the edge (404 there). Requires the internal bearer when configured.
        On a shared box, requires the owner's go after ingest finishes and the queue
        is empty. Removes facts, mentions and rejected-fact audits, preserves
        documents and stored chunk text, and re-queues extraction and judging
        without fetching or converting again. Busy documents are skipped.
        Each document reset commits separately; if a later store operation fails,
        earlier successful resets remain queued. Inspect statuses before retrying.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                labels:
                  type: string
                  description: Installed preset; empty or omitted keeps each document's preset.
                  pattern: '^[a-zA-Z0-9_-]*$'
                document_id:
                  type: string
                  description: One document ID; empty or omitted selects every done document.
      responses:
        "202":
          description: Completed documents reset and queued; busy IDs (lock held) skipped. Documents that stop being done during a bulk run are skipped and not listed.
          content:
            application/json:
              schema:
                type: object
                required: [queued, busy]
                properties:
                  queued:
                    type: integer
                    minimum: 0
                  busy:
                    type: array
                    items:
                      type: string
        "400":
          description: Invalid JSON or unknown/invalid preset; nothing reset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown document ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Selected document is not done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: JSON body exceeds 1 MiB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Store failure; earlier successful resets remain queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: No rebuild pipeline wired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/ingest:
    post:
      tags: [documents]
      operationId: ingestDocument
      summary: Submit a document for ingestion
      description: |
        Accepts JSON (`url` or `text`), or a multipart form with a `file`
        field. The submission is queued for the worker pool; poll
        `/v1/documents/{id}/status` until `done` or `failed`. Re-submitting
        unchanged content is a no-op (`noop: true`) unless `force` is set.
        `labels` selects an installed YAML preset under `labels.presets_dir`;
        omitted/empty uses built-in defaults. Shipped presets are general,
        meeting, documentation, mail, news, code and demo; custom names are
        accepted. Invalid or unknown presets fail before ingestion. The preset
        is stored with the document and reused after restart.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestRequest"
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                source:
                  type: string
                  description: identity override; defaults to the filename
                labels:
                  type: string
                  description: Installed label preset name; empty uses built-in defaults
                  pattern: '^[a-zA-Z0-9_-]*$'
                force:
                  type: string
                  description: '"true" or "1" re-runs unchanged content; all other values are false'
      responses:
        "202":
          description: queued for processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResponse"
        "200":
          description: no-op (unchanged content already ingested)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResponse"
        "400":
          description: invalid request or rejected input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: body exceeds the upload cap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: no ingestion pipeline wired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: |
            Store or value-conversion failure, or a spool write failure
            (`error: ingest_unavailable`, `detail: could not persist submission`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: |
            Retryable admission failure: the spool is full (`error: ingest_busy`),
            or a submission needs a payload while a worker holds the document
            lock (`error: document_busy`). Unchanged non-force submissions for a
            live version return a no-op even while that version is processing.
          headers:
            Retry-After:
              description: seconds to wait before retrying
              schema:
                type: integer
                minimum: 0
                example: 30
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/documents:
    get:
      tags: [documents]
      operationId: listDocuments
      summary: List documents
      parameters:
        - name: limit
          in: query
          description: defaults to 100, capped at 1000
          schema: { type: integer, minimum: 1, default: 100 }
        - name: status
          in: query
          description: Exact status filter; an unknown status yields an empty list.
          schema: { type: string, example: done }
      responses:
        "200":
          description: documents, most recently updated first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
        "400":
          $ref: "#/components/responses/BadRequest"
  /v1/documents/{id}:
    get:
      tags: [documents]
      operationId: getDocument
      summary: Get one document
      parameters:
        - $ref: "#/components/parameters/DocumentID"
      responses:
        "200":
          description: the document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
    delete:
      tags: [documents]
      operationId: deleteDocument
      summary: Delete a document (or its whole version chain)
      description: Removes the document with its chunks, fact edges and mentions, and prunes the entities left without relationships. Without the chain flag exactly one version is removed; with it, every version of the same source identity goes in one all-or-nothing transaction. There is no undo.
      parameters:
        - $ref: "#/components/parameters/DocumentID"
        - name: chain
          in: query
          required: false
          schema:
            type: string
            enum: ["1", "true", "0", "false"]
          description: "1/true removes every version of the same source; default: only this version"
      responses:
        "200":
          description: number of removed document versions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/documents/{id}/status:
    get:
      tags: [documents]
      operationId: getDocumentStatus
      summary: Get one document's pipeline status
      parameters:
        - $ref: "#/components/parameters/DocumentID"
      responses:
        "200":
          description: status and error of the document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/documents/{id}/content:
    get:
      tags: [documents]
      operationId: getDocumentContent
      summary: Get one document's stored text rendered to HTML
      description: Reconstructs the document's stored chunks server-side (overlapping sentences skipped by offset, inter-chunk gaps normalized to paragraph breaks) and renders the markdown with raw HTML omitted and unsafe link/image destinations neutralized. Superseded versions typically have no stored text left.
      parameters:
        - $ref: "#/components/parameters/DocumentID"
      responses:
        "200":
          description: document metadata, the rendered HTML and the ordered chunk index
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentContent"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          description: Store or value-conversion failure, or markdown render failure (error render_error).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/Unavailable"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/search:
    post:
      tags: [graph]
      operationId: search
      summary: Search entities, chunks or both
      description: Entities and chunks are searched through the Memgraph text indexes; when the embedder is enabled, entity hits fuse the text leg with entity-embedding vector hits (text recall is never dropped). Chunks are text-only in v0.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "200":
          description: ranked hits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
  /v1/entities/{id}:
    get:
      tags: [graph]
      operationId: getEntity
      summary: Get an entity with its aliases and evidenced facts
      parameters:
        - name: id
          in: path
          required: true
          description: entity id or entity key
          schema: { type: string }
        - name: include_low_confidence
          in: query
          description: '"true" or "1" includes facts below the assert floor; all other values are false'
          schema: { type: string, default: "false" }
      responses:
        "200":
          description: the entity view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entity"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/traverse:
    post:
      tags: [graph]
      operationId: traverse
      summary: Walk fact edges from a start entity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TraverseRequest"
      responses:
        "200":
          description: the reachable subgraph with evidence excerpts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraverseResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
  /v1/cypher:
    post:
      tags: [operator]
      operationId: queryCypher
      summary: Run a guarded read-only Cypher query
      description: |
        Operator route; not exposed through the edge (404 there).
        Exactly one statement; write clauses (`CREATE`, `MERGE`, `SET`,
        `DELETE`, `DETACH`, `REMOVE`, `DROP`, `ALTER`, `LOAD`) are
        rejected, `CALL` is limited to the `vector_search.` and
        `text_search.` procedure namespaces, and `UNION` is rejected (a
        per-branch LIMIT cannot enforce a post-union row cap). Queries
        without `LIMIT` gain `LIMIT $cypher_rows`; a LIMIT that is not a
        plain integer or `$cypher_rows`, or a numeric LIMIT above the cap,
        is rejected; `limit` tightens the injected cap and is clamped to
        `Limits.CypherRows`. Execution is bounded by
        `Limits.CypherTimeoutMS`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CypherRequest"
      responses:
        "200":
          description: query result; nodes/relationships become JSON objects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CypherResponse"
        "400":
          description: rejected query or query-level failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
        "504":
          description: query exceeded the configured timeout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
  /v1/agent/ask:
    post:
      tags: [agent]
      operationId: askAgent
      summary: Ask a bounded read-only agent
      description: |
        Runs the enabled agent within its step, context and time budgets.
        Returns an answer, optional server-rendered answer_html and raw tool
        evidence. A step/context budget reached without a final answer still
        returns 200 with the evidence gathered. A disabled agent returns 501
        before reading the body. Questions are trimmed and must not be empty.
      requestBody:
        $ref: "#/components/requestBodies/AskQuestion"
      responses:
        "200":
          description: Answer and tool evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentAnswer"
        "400":
          description: Malformed JSON (invalid_json) or missing/blank question (invalid_request).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "501":
          $ref: "#/components/responses/AgentDisabled"
        "502":
          description: Provider or agent failure (error agent_error); detail is classified and excludes endpoint/key secrets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: agent_error
                detail: agent provider request failed
        "504":
          description: Agent deadline exceeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: agent_timeout
                detail: the agent timed out before answering
  /v1/agent/ask/stream:
    post:
      tags: [agent]
      operationId: streamAgent
      summary: Ask the agent with Server-Sent Events
      description: |
        Same question and limits as /v1/agent/ask. Disabled-agent and request
        validation errors are JSON before the SSE response starts. Once the
        response starts, HTTP status stays 200, including agent/provider errors.
        Each named event has a JSON data payload: `tool` has name and arguments,
        `delta` has text, `done` has the authoritative full AgentAnswer (including
        answer_html when present), and `error` has error and detail. A terminal
        error is agent_timeout for deadline expiry, otherwise agent_error.
        The stream sends `: ping` comment heartbeats every 15 seconds and stops
        on disconnect. With provider streaming off it remains SSE and sends tool
        and done events only, plus heartbeats or a terminal error. Clients should
        replace accumulated delta text with the authoritative done answer.
      requestBody:
        $ref: "#/components/requestBodies/AskQuestion"
      responses:
        "200":
          description: SSE frames terminated by done or error; heartbeat comments carry no JSON payload.
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-cache] }
            X-Accel-Buffering:
              schema: { type: string, enum: ["no"] }
          content:
            text/event-stream:
              schema: { type: string }
              x-sse-events:
                tool:
                  type: object
                  required: [name, arguments]
                  properties:
                    name: { type: string }
                    arguments:
                      description: Raw JSON arguments, of any JSON type; invalid JSON is represented as a string. May be null.
                delta:
                  type: object
                  required: [text]
                  properties:
                    text: { type: string, description: Progressive answer fragment }
                done:
                  $ref: "#/components/schemas/AgentAnswer"
                error:
                  $ref: "#/components/schemas/Error"
              example: |
                : ping

                event: tool
                data: {"name":"search","arguments":{"query":"Ada"}}

                event: delta
                data: {"text":"Ada"}

                event: done
                data: {"answer":"Ada","answer_html":"<p>Ada</p>\n","evidence":[],"steps":1}

        "400":
          description: Malformed JSON (invalid_json) or missing/blank question (invalid_request), before SSE starts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "501":
          $ref: "#/components/responses/AgentDisabled"
  /v1/agent/status:
    get:
      tags: [agent]
      operationId: getAgentStatus
      summary: Probe agent capabilities
      description: |
        Always registered, including when the agent is disabled. Returns 200
        with enabled=false and stream=false when disabled. stream is true only
        when the agent is enabled, provider streaming is configured, and the
        process has not memoized provider streaming as unsupported.
      responses:
        "200":
          description: Agent and provider-streaming availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /healthz:
    get:
      tags: [health]
      operationId: healthz
      summary: Process liveness probe
      description: Direct gkg returns JSON. The nginx edge answers this path itself with plain text, without login.
      security: []
      responses:
        "200":
          description: process is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
            text/plain:
              schema: { type: string, example: "ok\n" }
  /readyz:
    get:
      tags: [operator]
      operationId: readyz
      summary: Readiness probe (Memgraph connectivity)
      description: Direct gkg probe; not exposed through the edge (404 there).
      security: []
      responses:
        "200":
          description: dependencies reachable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
        "503":
          description: dependency unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /metrics:
    get:
      tags: [operator]
      operationId: metrics
      summary: Prometheus metrics
      description: Direct gkg scrape; not exposed through the edge (404 there). Registered when metrics are wired (always by gkg serve).
      security: []
      responses:
        "200":
          description: scrape
          content:
            text/plain:
              schema: { type: string }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Direct gkg access when GKG_API_KEY is set. Do not use through the nginx edge.
    basicAuth:
      type: http
      scheme: basic
      description: Through the nginx edge. Browser login is reused automatically; the edge supplies the internal bearer.
  requestBodies:
    AskQuestion:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AgentQuestion"
  parameters:
    DocumentID:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: "^[0-9a-f]{32}$" }
  responses:
    AgentDisabled:
      description: Agent is disabled; returned before reading the request body.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: agent_disabled
            detail: the ask agent is not enabled on this server
    Unauthorized:
      description: Missing or invalid bearer token directly to gkg. The edge instead challenges for Basic login before proxying (its 401 body is not JSON).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BodyTooLarge:
      description: JSON body exceeds 1 MiB (error body_too_large).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    GatewayTimeout:
      description: Store operation exceeded its deadline.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: no such document or entity
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: store or value-conversion failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: graph store not wired
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [error, detail]
      properties:
        error: { type: string }
        detail: { type: string }
    IngestRequest:
      type: object
      description: Exactly one non-empty url (trimmed) or text is required; source, labels and force are optional.
      oneOf:
        - required: [url]
          properties:
            url: { minLength: 1 }
            text: { enum: [""] }
        - required: [text]
          properties:
            text: { minLength: 1 }
            url: { pattern: '^\s*$' }
      properties:
        url: { type: string, format: uri }
        text: { type: string }
        source:
          type: string
          description: Identity override; defaults to the submitted URL (url) or the first 8 hex characters of the cleaned content SHA-256 (text)
        labels:
          type: string
          description: Installed label preset name; empty uses built-in defaults. Custom presets are allowed.
          pattern: '^[a-zA-Z0-9_-]*$'
        force:
          type: boolean
          default: false
    IngestResponse:
      type: object
      required: [document_id, noop]
      properties:
        document_id: { type: string }
        noop: { type: boolean }
    Document:
      type: object
      required: [id, source_kind, source, status, created_at, updated_at]
      properties:
        id: { type: string }
        source_kind: { type: string, enum: [url, file, text] }
        source: { type: string }
        final_url: { type: string }
        title: { type: string }
        status:
          type: string
          enum:
            [
              received,
              fetched,
              chunked,
              extracted,
              merged,
              verifying,
              done,
              failed,
              superseded,
            ]
        error: { type: string }
        labels: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        supersedes: { type: string }
    DocumentsResponse:
      type: object
      required: [documents]
      properties:
        documents:
          type: array
          items:
            $ref: "#/components/schemas/Document"
    Status:
      type: object
      required: [id, status, updated_at]
      properties:
        id: { type: string }
        status:
          type: string
          enum:
            [
              received,
              fetched,
              chunked,
              extracted,
              merged,
              verifying,
              done,
              failed,
              superseded,
            ]
        error: { type: string }
        updated_at: { type: string, format: date-time }
    SearchRequest:
      type: object
      required: [query]
      properties:
        query: { type: string }
        kind:
          type: string
          enum: [entity, chunk, auto]
          default: auto
        limit:
          type: integer
          default: 20
          description: Non-positive values select the default (20); values above 100 are capped at 100
    SearchResponse:
      type: object
      required: [hits]
      properties:
        hits:
          type: array
          items:
            $ref: "#/components/schemas/Hit"
    Hit:
      type: object
      required: [kind, id, title, score, snippet]
      properties:
        kind: { type: string, enum: [entity, chunk] }
        id: { type: string }
        title: { type: string }
        score: { type: number, format: double }
        snippet: { type: string }
        document_id:
          type: string
          description: chunk hits only — the owning document id
    DocumentContent:
      type: object
      required: [document, html, chunks]
      properties:
        document:
          $ref: "#/components/schemas/Document"
        html:
          type: string
          description: server-rendered markdown; raw HTML never passes through
        chunks:
          type: array
          items:
            $ref: "#/components/schemas/ChunkRef"
    ChunkRef:
      type: object
      required: [id, seq, start, end]
      properties:
        id: { type: string }
        seq: { type: integer }
        start: { type: integer }
        end: { type: integer }
    DeleteResult:
      type: object
      required: [deleted]
      properties:
        deleted:
          type: integer
          minimum: 0
          description: how many document versions were removed
    EntityRef:
      type: object
      required: [id, key, name, type]
      properties:
        id: { type: string }
        key: { type: string }
        name: { type: string }
        type: { type: string }
    CoMention:
      allOf:
        - $ref: "#/components/schemas/EntityRef"
        - type: object
          required: [shared_chunks]
          properties:
            shared_chunks:
              type: integer
              minimum: 1
              description: number of distinct chunks mentioning both entities
    Fact:
      type: object
      required:
        [
          rel,
          other,
          confidence,
          low_confidence,
          outgoing,
          doc_id,
          chunk_id,
          excerpt,
        ]
      properties:
        rel: { type: string }
        other:
          $ref: "#/components/schemas/EntityRef"
        confidence: { type: number, format: double }
        judge: { type: string, enum: ["", confirmed, unclear] }
        low_confidence: { type: boolean }
        outgoing: { type: boolean }
        doc_id: { type: string }
        chunk_id: { type: string }
        excerpt: { type: string }
    Entity:
      type: object
      required: [id, key, name, type, aliases, mention_count, facts, together]
      properties:
        id: { type: string }
        key: { type: string }
        name: { type: string }
        type: { type: string }
        aliases:
          type: array
          items: { type: string }
        mention_count: { type: integer }
        facts:
          type: array
          items:
            $ref: "#/components/schemas/Fact"
        together:
          type: array
          maxItems: 10
          description: co-mentioned entities, ordered by shared chunks descending, mention count descending, then key ascending
          items:
            $ref: "#/components/schemas/CoMention"
    TraverseRequest:
      type: object
      required: [entity]
      properties:
        entity:
          type: string
          description: start entity id or key
        relation: { type: string }
        direction:
          type: string
          enum: [out, in, both]
          default: out
        depth:
          type: integer
          minimum: 0
          maximum: 2
          default: 1
          description: 0 selects the default (1); otherwise must be 1 or 2
        limit:
          type: integer
          minimum: 0
          default: 50
          description: 0 selects the default (50); values above 200 are capped; negative values are rejected
        include_low_confidence:
          type: boolean
          default: false
    Edge:
      type: object
      required:
        [from, to, rel, confidence, low_confidence, doc_id, chunk_id, excerpt]
      properties:
        from: { type: string }
        to: { type: string }
        rel: { type: string }
        confidence: { type: number, format: double }
        judge: { type: string, enum: ["", confirmed, unclear] }
        low_confidence: { type: boolean }
        doc_id: { type: string }
        chunk_id: { type: string }
        excerpt: { type: string }
    TraverseResponse:
      type: object
      required: [nodes, edges]
      properties:
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/EntityRef"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/Edge"
    CypherRequest:
      type: object
      required: [query]
      properties:
        query: { type: string }
        limit:
          type: integer
          description: Positive values tighten the row cap; non-positive or above-cap values use Limits.CypherRows (default 1000)
    CypherResponse:
      type: object
      required: [columns, rows]
      properties:
        columns:
          type: array
          items: { type: string }
        rows:
          type: array
          items:
            type: object
            additionalProperties: true
    AgentQuestion:
      type: object
      required: [question]
      properties:
        question:
          type: string
          minLength: 1
          description: Trimmed before use; whitespace-only questions are rejected.
          example: What does the graph say about Ada?
    AgentAnswer:
      type: object
      required: [answer, evidence, steps]
      properties:
        answer: { type: string }
        answer_html:
          type: string
          description: Optional server-rendered Markdown answer with raw HTML omitted and unsafe destinations neutralized.
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/AgentEvidence"
        steps:
          type: integer
          minimum: 0
          description: Model turns requesting tools; budget-skipped calls may still appear in evidence.
    AgentEvidence:
      type: object
      required: [tool]
      properties:
        tool: { type: string }
        arguments:
          description: Raw JSON tool arguments, of any JSON type; invalid JSON is represented as a string. May be null or omitted.
        result:
          description: Raw JSON tool result or tool error, of any JSON type; may be null or omitted.
    AgentStatus:
      type: object
      required: [enabled, stream]
      properties:
        enabled: { type: boolean }
        stream: { type: boolean }
