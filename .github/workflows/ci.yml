name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GKG_REQUIRE_NODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: go test ./...

  integration:
    runs-on: ubuntu-latest
    services:
      memgraph:
        image: memgraph/memgraph:3.14.0
        ports:
          - 7687:7687
    env:
      GKG_TEST_MEMGRAPH_URI: bolt://localhost:7687
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Integration tests
        run: go test -p 1 ./... -count=1

  edge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Edge acceptance
        run: bash scripts/edge-check.sh

  sidecar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install contract-test dependencies
        run: pip install "fastapi>=0.115,<1" "pydantic>=2.7,<3" "pytest>=8" "httpx>=0.27" "uvicorn[standard]>=0.30,<1"
      - name: Sidecar contract tests
        run: pytest sidecar/

  acceptance:
    runs-on: ubuntu-latest
    services:
      memgraph:
        image: memgraph/memgraph:3.14.0
        ports:
          - 7687:7687
    env:
      ACCEPTANCE_MODE: local
      GKG_MEMGRAPH_URI: bolt://localhost:7687
      GKG_EXTRACTOR_MODE: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Acceptance run (local, mock extractor)
        run: bash scripts/acceptance.sh
