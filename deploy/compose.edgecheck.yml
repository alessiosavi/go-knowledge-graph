# Only used by the isolated, offline edge acceptance check.
services:
  # Fake lineage only: acceptance cannot contact an ACME service.
  certbot:
    network_mode: none
  llmstub:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.llmstub
    mem_limit: 64m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  gkg:
    depends_on:
      llmstub:
        condition: service_started
