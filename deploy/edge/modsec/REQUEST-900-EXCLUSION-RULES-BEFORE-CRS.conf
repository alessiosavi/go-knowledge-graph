# DetectionOnly evidence: edge-check JSON corpus design.md needs 930120,
# 932230, 932235, 932130, 932250, 942190, 942270, 942350 on json.text.
# edge-check JSON corpus sql.md needs 932370, 942100, 942190, 942270, 942350.
# These documents deliberately contain SQL, shell and Cypher examples.
# edge-check SQL-looking search: the SQL example is the search input itself.
# edge-check MCP call 1 (tools/call search): the same SQL-looking search text.
# The MCP envelope's method and params.name remain inspected.
# R3: synthetic polyglot design corpus is data, not executable input.
# R4: edge-check JSON corpus html.md and MCP corpus html.md matched 921130
# on json.text and json.params.arguments.text. Apply attack-protocol to the
# same R3 named fields; it does not remove any protocol rule from REQUEST_BODY.
# The R3 attack tags are verified in pinned CRS 4.30.0. Only these named
# free-text targets are exempt; metadata, envelope, headers and URI stay inspected.
# attack-injection-java targets only FILES/filename headers (944140), not ARGS;
# it has no named-field exclusion. Java ARGS rules also carry attack-rce.

# edge-check corpus: /v1/ingest text (MCP ingest/search only).
SecRule REQUEST_METHOD "@streq POST" "id:10001,phase:1,pass,nolog,chain"
    SecRule REQUEST_FILENAME "@streq /v1/ingest" "ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:json.text,ctl:ruleRemoveTargetByTag=attack-rce;ARGS:json.text,ctl:ruleRemoveTargetByTag=attack-xss;ARGS:json.text,ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:json.text,ctl:ruleRemoveTargetByTag=attack-rfi;ARGS:json.text,ctl:ruleRemoveTargetByTag=attack-injection-php;ARGS:json.text,ctl:ruleRemoveTargetByTag=attack-injection-generic;ARGS:json.text,ctl:ruleRemoveTargetByTag=attack-fixation;ARGS:json.text,ctl:ruleRemoveTargetByTag=attack-protocol;ARGS:json.text"

# edge-check corpus: /v1/search query (MCP ingest/search only).
SecRule REQUEST_METHOD "@streq POST" "id:10002,phase:1,pass,nolog,chain"
    SecRule REQUEST_FILENAME "@streq /v1/search" "ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:json.query,ctl:ruleRemoveTargetByTag=attack-rce;ARGS:json.query,ctl:ruleRemoveTargetByTag=attack-xss;ARGS:json.query,ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:json.query,ctl:ruleRemoveTargetByTag=attack-rfi;ARGS:json.query,ctl:ruleRemoveTargetByTag=attack-injection-php;ARGS:json.query,ctl:ruleRemoveTargetByTag=attack-injection-generic;ARGS:json.query,ctl:ruleRemoveTargetByTag=attack-fixation;ARGS:json.query,ctl:ruleRemoveTargetByTag=attack-protocol;ARGS:json.query"

