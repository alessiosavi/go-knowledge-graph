SecRule REQUEST_METHOD "@streq POST" "id:10011,phase:1,pass,nolog,chain"
    SecRule REQUEST_FILENAME "@streq /v1/ingest" "ctl:ruleRemoveTargetByTag=OWASP_CRS/ATTACK-JAVA;REQUEST_BODY"

