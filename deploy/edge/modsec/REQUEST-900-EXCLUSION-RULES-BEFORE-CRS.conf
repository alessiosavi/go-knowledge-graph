    SecRule REQUEST_FILENAME "@streq /v1/agent/ask" "ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:json.question,ctl:ruleRemoveTargetByTag=attack-rce;ARGS:json.question,ctl:ruleRemoveTargetByTag=attack-xss;ARGS:json.question,ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:json.question,ctl:ruleRemoveTargetByTag=attack-rfi;ARGS:json.question,ctl:ruleRemoveTargetByTag=attack-injection-php;ARGS:json.question,ctl:ruleRemoveTargetByTag=attack-injection-generic;ARGS:json.question,ctl:ruleRemoveTargetByTag=attack-fixation;ARGS:json.question,ctl:ruleRemoveTargetByTag=attack-protocol;ARGS:json.question"

