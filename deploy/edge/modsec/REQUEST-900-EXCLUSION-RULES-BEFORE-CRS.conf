    SecRule REQUEST_FILENAME "@streq /mcp" "ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:json.params.arguments.text,ctl:ruleRemoveTargetByTag=attack-rce;ARGS:json.params.arguments.text,ctl:ruleRemoveTargetByTag=attack-xss;ARGS:json.params.arguments.text,ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:json.params.arguments.text,ctl:ruleRemoveTargetByTag=attack-rfi;ARGS:json.params.arguments.text,ctl:ruleRemoveTargetByTag=attack-injection-php;ARGS:json.params.arguments.text,ctl:ruleRemoveTargetByTag=attack-injection-generic;ARGS:json.params.arguments.text,ctl:ruleRemoveTargetByTag=attack-fixation;ARGS:json.params.arguments.text,ctl:ruleRemoveTargetByTag=attack-protocol;ARGS:json.params.arguments.text,ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:json.params.arguments.query,ctl:ruleRemoveTargetByTag=attack-rce;ARGS:json.params.arguments.query,ctl:ruleRemoveTargetByTag=attack-xss;ARGS:json.params.arguments.query,ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:json.params.arguments.query,ctl:ruleRemoveTargetByTag=attack-rfi;ARGS:json.params.arguments.query,ctl:ruleRemoveTargetByTag=attack-injection-php;ARGS:json.params.arguments.query,ctl:ruleRemoveTargetByTag=attack-injection-generic;ARGS:json.params.arguments.query,ctl:ruleRemoveTargetByTag=attack-fixation;ARGS:json.params.arguments.query,ctl:ruleRemoveTargetByTag=attack-protocol;ARGS:json.params.arguments.query"

# R4 evidence: edge-check multipart corpus dockerfile.md matched 932180 on
# FILES:file (filename substring); gkg never writes uploads by their name.
# All other rules still inspect FILES and FILES_NAMES.
SecRule REQUEST_METHOD "@streq POST" "id:10010,phase:1,pass,nolog,chain"
    SecRule REQUEST_FILENAME "@streq /v1/ingest" "ctl:ruleRemoveTargetById=932180;FILES:file"

