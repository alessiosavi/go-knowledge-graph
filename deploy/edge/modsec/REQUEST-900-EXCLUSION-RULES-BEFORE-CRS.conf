# DetectionOnly evidence: edge-check JSON corpus design.md needs 930120,
# 932230, 932235, 932130, 932250, 942190, 942270, 942350 on json.text.
# edge-check JSON corpus sql.md needs 932370, 942100, 942190, 942270, 942350.
# These documents deliberately contain SQL, shell and Cypher examples.
SecRule REQUEST_METHOD "@streq POST" "id:10001,phase:1,pass,nolog,chain"
    SecRule REQUEST_FILENAME "@streq /v1/ingest" "ctl:ruleRemoveTargetById=930120;ARGS:json.text,ctl:ruleRemoveTargetById=932230;ARGS:json.text,ctl:ruleRemoveTargetById=932235;ARGS:json.text,ctl:ruleRemoveTargetById=932130;ARGS:json.text,ctl:ruleRemoveTargetById=932250;ARGS:json.text,ctl:ruleRemoveTargetById=942190;ARGS:json.text,ctl:ruleRemoveTargetById=942270;ARGS:json.text,ctl:ruleRemoveTargetById=942350;ARGS:json.text,ctl:ruleRemoveTargetById=932370;ARGS:json.text,ctl:ruleRemoveTargetById=942100;ARGS:json.text"

# edge-check SQL-looking search: the SQL example is the search input itself.
SecRule REQUEST_METHOD "@streq POST" "id:10002,phase:1,pass,nolog,chain"
    SecRule REQUEST_FILENAME "@streq /v1/search" "ctl:ruleRemoveTargetById=942100;ARGS:json.query,ctl:ruleRemoveTargetById=942190;ARGS:json.query,ctl:ruleRemoveTargetById=942270;ARGS:json.query"

# edge-check MCP call 1 (tools/call search): the same SQL-looking search text.
# The MCP envelope's method and params.name remain inspected.
SecRule REQUEST_METHOD "@streq POST" "id:10003,phase:1,pass,nolog,chain"
    SecRule REQUEST_FILENAME "@streq /mcp" "ctl:ruleRemoveTargetById=942100;ARGS:json.params.arguments.query"
