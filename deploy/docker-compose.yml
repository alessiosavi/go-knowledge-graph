# gkg stack: authenticated Memgraph, gkg, GLiNEREL and docling.
# Requires Docker Compose >= 2.24.4 (optional env_file, !reset, !override).
# Copy .env.example to .env, set MEMGRAPH_PASSWORD, then run make up.
# Use make up LIGHT=1 for CI or laptops without the model services.
name: gkg
# Memory limits: peak x 1.5 (at least peak + 512 MiB), from a concurrent-load
# measurement (docling: 4 parallel documents incl. a 101-page PDF on 2 engine
# workers, peak 4.3 GiB; sidecar: 4 ingest workers extracting, 3.1 GiB; 4
# streamed asks). Memgraph (peak 0.4 GiB) keeps ~4x headroom for corpus
# growth. The sum (14 GiB) leaves 2 GiB of a 16 GiB host.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  memgraph:
    image: memgraph/memgraph:3.14.0@sha256:a732421217951066e42f5749111bc3d0c7b51b12c756be04850d4dafa84cc05e
    restart: unless-stopped
    logging: *logging
    mem_limit: 1344m
    command: ["--memory-limit=832"]
    environment:
      MEMGRAPH_USER: ${MEMGRAPH_USER:-gkg}
      MEMGRAPH_PASSWORD: ${MEMGRAPH_PASSWORD:?set MEMGRAPH_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MEMGRAPH_PORT:-7687}:7687"
    volumes:
      - memgraph-data:/var/lib/memgraph
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/7687"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  gkg:
    restart: unless-stopped
    logging: *logging
    mem_limit: 768m
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gkg
    depends_on:
      memgraph:
        condition: service_healthy
      sidecar:
        condition: service_healthy
      docling:
        condition: service_healthy
    # Every GKG_* knob from .env reaches the container; the explicit
    # environment entries below win over env_file for the compose wiring
    # (Memgraph host/credentials, server address, labels path).
    env_file:
      - path: ${GKG_ENV_FILE:-../.env}
        required: false
    environment:
      GKG_MEMGRAPH_URI: bolt://memgraph:7687
      GKG_MEMGRAPH_USER: ${MEMGRAPH_USER:-gkg}
      GKG_MEMGRAPH_PASSWORD: ${MEMGRAPH_PASSWORD:?set MEMGRAPH_PASSWORD in .env}
      GKG_SERVER_ADDR: ":8080"
      GKG_API_KEY: ${GKG_API_KEY:-}
      GKG_EXTRACTOR_MODE: ${GKG_EXTRACTOR_MODE:-sidecar}
      GKG_EXTRACTOR_OPENAI_BASE_URL: ${GKG_EXTRACTOR_OPENAI_BASE_URL:-https://api.openai.com/v1}
      GKG_EXTRACTOR_OPENAI_API_KEY: ${GKG_EXTRACTOR_OPENAI_API_KEY:-}
      GKG_EXTRACTOR_OPENAI_MODEL: ${GKG_EXTRACTOR_OPENAI_MODEL:-deepseek-v4.1-flash}
      GKG_EXTRACTOR_SIDECAR_URL: ${GKG_EXTRACTOR_SIDECAR_URL:-http://sidecar:8090}
      GKG_EXTRACTOR_SIDECAR_MODEL: ${GKG_EXTRACTOR_SIDECAR_MODEL:-glinerel-314m}
      GKG_EXTRACTOR_SIDECAR_TIMEOUT_S: ${GKG_EXTRACTOR_SIDECAR_TIMEOUT_S:-300}
      GKG_INGEST_SPOOL_DIR: /var/lib/gkg/ingest-spool
      # Provider "" (openai default) or furls; with furls the endpoints and
      # the shared secret arrive from .env via env_file (never committed).
      GKG_EMBEDDER_ENABLED: ${GKG_EMBEDDER_ENABLED:-false}
      GKG_EMBEDDER_BASE_URL: ${GKG_EMBEDDER_BASE_URL:-https://api.openai.com/v1}
      GKG_EMBEDDER_API_KEY: ${GKG_EMBEDDER_API_KEY:-}
      # Empty → provider default (openai: text-embedding-3-small; furls
      # requires empty or gemini-embedding-2 — a pinned default here would
      # 400 every furls call).
      GKG_EMBEDDER_MODEL: ${GKG_EMBEDDER_MODEL:-}
      GKG_EMBEDDER_DIM: ${GKG_EMBEDDER_DIM:-768}
      GKG_CONVERTER_MODE: ${GKG_CONVERTER_MODE:-docling}
      GKG_CONVERTER_URL: ${GKG_CONVERTER_URL:-http://docling:5001}
      GKG_CONVERTER_API_KEY: ${DOCLING_API_KEY:-}
      GKG_CONVERTER_TIMEOUT_S: ${GKG_CONVERTER_TIMEOUT_S:-300}
      GKG_JUDGE_MODE: ${GKG_JUDGE_MODE:-off}
      GKG_JUDGE_BASE_URL: ${GKG_JUDGE_BASE_URL:-https://api.openai.com/v1}
      GKG_JUDGE_API_KEY: ${GKG_JUDGE_API_KEY:-}
      GKG_JUDGE_MODEL: ${GKG_JUDGE_MODEL:-deepseek-v4.1-flash}
      GKG_LABELS_PRESETS_DIR: ${GKG_LABELS_PRESETS_DIR:-/labels}
    ports:
      - "127.0.0.1:${GKG_PORT:-8080}:8080"
    volumes:
      - ../labels:/labels:ro
      - gkg-data:/var/lib/gkg

  # Local, fully-offline extraction: GLiNEREL sidecar with the
  # weights baked into the image (runtime HF_HUB_OFFLINE=1).
  sidecar:
    restart: unless-stopped
    logging: *logging
    mem_limit: 4864m
    build:
      context: ../sidecar
      args:
        # Select the baked checkpoint (314m default, 72m, or any full
        # repository id); rebuild after changing it with `up --build`.
        GLINEREL_MODEL: ${GLINEREL_MODEL:-314m}
        GLINEREL_MODEL_REVISION: ${GLINEREL_MODEL_REVISION:-}
    ports:
      - "127.0.0.1:${SIDECAR_PORT:-8090}:8090"
    environment:
      GLINEREL_MODEL: ${GLINEREL_MODEL:-314m}
      HF_HUB_OFFLINE: "1"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8090/healthz').status==200 else sys.exit(1)"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  # High-quality document conversion (PDF/Office/images → markdown)
  # via docling-serve. The image carries
  # the model weights (~4.4 GB); set DOCLING_API_KEY to require X-Api-Key.
  # Tesseract: 12 MP photo peak 4.80 GiB; 2 photos + 101-page PDF peak 5.74 GiB.
  docling:
    restart: unless-stopped
    logging: *logging
    mem_limit: 6656m
    image: ghcr.io/docling-project/docling-serve-cpu:v1.38.2@sha256:7a480a1604fa3b42efeddc7db9527690d9f9bc903226136013e2bfe6b1a4dfb0
    ports:
      - "127.0.0.1:${DOCLING_PORT:-5001}:5001"
    environment:
      DOCLING_SERVE_API_KEY: ${DOCLING_API_KEY:-}
      # Just below gkg's 300s client budget: a slow conversion fails server-side
      # within the client budget (the task keeps running after the 504).
      DOCLING_SERVE_MAX_SYNC_WAIT: "280"
      DOCLING_SERVE_ENG_LOC_NUM_WORKERS: ${DOCLING_ENG_WORKERS:-2}
      DOCLING_NUM_THREADS: ${DOCLING_NUM_THREADS:-4}
      # DOCLING_DEVICE: cpu
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:5001/health').read(); sys.exit(0)"
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 60s

  edge-init:
    image: owasp/modsecurity-crs:4.30.0-nginx-202611090911@sha256:9a386aa4a9eeec9a46c61a1eaba101c846dd83b1ec125e9126e710dd61d84422
    user: "0:0"
    entrypoint: ["/bin/sh", "/edge-init.sh"]
    restart: "no"
    logging: *logging
    mem_limit: 64m
    environment:
      SERVER_NAME: ${EDGE_SERVER_NAME:-localhost}
    volumes:
      - ./edge/init.sh:/edge-init.sh:ro
      - edge-certs:/etc/nginx/edge-certs
      - edge-auth:/etc/nginx/edge-auth
      - acme-webroot:/var/www/acme
      - type: bind
        source: ${EDGE_HTPASSWD:-./edge/htpasswd}
        target: /run/edge/htpasswd
        read_only: true
        bind:
          create_host_path: false

  edge:
    image: owasp/modsecurity-crs:4.30.0-nginx-202611090911@sha256:9a386aa4a9eeec9a46c61a1eaba101c846dd83b1ec125e9126e710dd61d84422
    restart: unless-stopped
    logging: *logging
    # Measured (2 workers): 4 near-cap JSON + 4 near-20 MiB uploads + 4 streamed
    # asks at once peaked at 455 MiB anon -> limit 1.5x; taken from Memgraph's
    # headroom, so the long-running sum stays 14 GiB.
    mem_limit: 704m
    depends_on:
      gkg:
        condition: service_healthy
      edge-init:
        condition: service_completed_successfully
    env_file:
      - path: ${EDGE_WAF_ENV:-./edge/waf.env}
        required: false
    environment:
      SERVER_NAME: ${EDGE_SERVER_NAME:-localhost}
      GKG_API_KEY: ${GKG_API_KEY:?set GKG_API_KEY in .env — the edge sends it to gkg}
      EDGE_HTTPS_PORT: ${EDGE_HTTPS_PORT:-443}
      EDGE_HSTS_MAX_AGE: ${EDGE_HSTS_MAX_AGE:-0}
      EDGE_INGEST_TIMEOUT_S: ${EDGE_INGEST_TIMEOUT_S:-390}
      EDGE_ASK_TIMEOUT_S: ${EDGE_ASK_TIMEOUT_S:-90}
      MODSEC_RESP_BODY_ACCESS: "Off"
      ALLOWED_METHODS: "GET HEAD POST OPTIONS DELETE"
      MODSEC_REQ_BODY_LIMIT: "22020096"
      MODSEC_REQ_BODY_NOFILES_LIMIT: "4259840"
      MODSEC_REQ_BODY_LIMIT_ACTION: "Reject"
      # Two workers: each loads the full CRS and a reload doubles them until
      # long streams drain, so a fixed count keeps memory host-independent.
      NGINX_WORKER_PROCESSES: "2"
      MODSEC_AUDIT_LOG_PARTS: ADEFHZ
      PARANOIA: "1"
      BLOCKING_PARANOIA: "1"
      ANOMALY_INBOUND: "5"
      # No proxy in front; do not trust inbound real-IP headers.
      SET_REAL_IP_FROM: ""
      REAL_IP_HEADER: ""
    ports:
      - "${EDGE_BIND:-127.0.0.1}:${EDGE_HTTP_PORT:-80}:8080"
      - "${EDGE_BIND:-127.0.0.1}:${EDGE_HTTPS_PORT:-443}:8443"
    volumes:
      - ./edge/default.conf.template:/etc/nginx/templates/conf.d/default.conf.template:ro
      - ./edge/setup.conf.template:/etc/nginx/templates/modsecurity.d/setup.conf.template:ro
      - ./edge/15-validate-env.sh:/docker-entrypoint.d/15-validate-env.sh:ro
      - ./edge/modsec/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf:/etc/modsecurity.d/owasp-crs/rules/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf:ro
      - ./edge/modsec/RESPONSE-999-EXCLUSION-RULES-AFTER-CRS.conf:/etc/modsecurity.d/owasp-crs/rules/RESPONSE-999-EXCLUSION-RULES-AFTER-CRS.conf:ro
      - edge-certs:/etc/nginx/edge-certs:ro
      - edge-auth:/etc/nginx/edge-auth:ro
      - acme-webroot:/var/www/acme:ro
    healthcheck:
      test: ["CMD", "curl", "-fsSk", "https://localhost:8443/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # One-shot certificate commands; never started with the default stack.
  certbot:
    image: certbot/certbot:v5.10.0@sha256:c5698da859429ccee0fcc299a8000368198222d1f9e789ab6e388b491e8ce06d
    profiles: [cert]
    mem_limit: 256m
    logging: *logging
    volumes:
      - ./edge/install-cert.sh:/edge-install-cert.sh:ro
      - letsencrypt:/etc/letsencrypt
      - acme-webroot:/var/www/acme
      - edge-certs:/etc/nginx/edge-certs

volumes:
  gkg-data:
  memgraph-data:
  edge-certs:
  edge-auth:
  acme-webroot:
  letsencrypt:
